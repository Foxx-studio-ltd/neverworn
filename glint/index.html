<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141413">
<meta name="description" content="See it. Say it. Send it. Snap anything, say what you want, send it to your AI.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Glint">
<meta property="og:title" content="Glint">
<meta property="og:description" content="See it. Say it. Send it.">
<meta property="og:image" content="icons/og.png">

<link rel="icon" href="icons/icon-192.png">

</head><body>
<title>Glint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one full-bleed screen at a time (capture → compose → send), thumb-zone controls at the bottom.
   Three visual directions share one token set; data-dir on .app picks one. */
:root{
  --bg:#141413; --surface:#1f1e1c; --line:#34322e; --fg:#f4f1ea; --muted:#a29d93; --accent:#f2c46d; --accent-ink:#1a1408;
  --pin:#f2c46d; --pin-ink:#1a1408; --ink:#f2c46d;
  --f-ui:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mark:"Instrument Serif", Georgia, "Times New Roman", serif;
  --f-note:"Instrument Sans", system-ui, sans-serif;
  --r:18px; --r-sm:12px;
  color-scheme:dark;
}
.app[data-dir="paper"]{
  --bg:#eef0ec; --surface:#ffffff; --line:#d5d9d2; --fg:#16181a; --muted:#666c66; --accent:#2340e8; --accent-ink:#ffffff;
  --pin:#2340e8; --pin-ink:#ffffff; --ink:#2340e8;
  --f-mark:"Caveat", "Comic Sans MS", cursive; --f-note:"Caveat", "Comic Sans MS", cursive;
  --r:6px; --r-sm:4px; color-scheme:light;
}
.app[data-dir="signal"]{
  --bg:#c9b8ff; --surface:#fff7d6; --line:#111111; --fg:#111111; --muted:#3b3354; --accent:#ff5a36; --accent-ink:#111111;
  --pin:#111111; --pin-ink:#fff7d6; --ink:#ff5a36;
  --f-ui:"Space Grotesk", system-ui, sans-serif; --f-mark:"Space Grotesk", system-ui, sans-serif; --f-note:"Space Grotesk", system-ui, sans-serif;
  --r:26px; --r-sm:16px; color-scheme:light;
}
html,body{height:100%;margin:0;background:#141413;overscroll-behavior:none}
body{font-family:var(--f-ui)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,label.btn,a.btn{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,label.btn:focus-within,a.btn:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{position:fixed;inset:0;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;overflow:hidden;
  font-family:var(--f-ui);transition:background .35s}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));z-index:5}
.mark{font-family:var(--f-mark);font-size:30px;line-height:1;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.mark i{font-style:italic}
.app[data-dir="signal"] .mark{font-weight:700;font-size:26px;letter-spacing:-.04em}
.spark{width:16px;height:16px;position:relative;display:inline-block}
.spark::before,.spark::after{content:"";position:absolute;inset:0;margin:auto;background:var(--accent);border-radius:2px}
.spark::before{width:2px;height:16px}.spark::after{width:16px;height:2px}
.spark{animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,80%,100%{transform:rotate(0) scale(1)}88%{transform:rotate(45deg) scale(1.25)}}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;position:relative}
.app[data-dir="signal"] .iconbtn{border-width:2px}
.iconbtn svg{width:20px;height:20px}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px}
.top-r{display:flex;gap:8px}

.view{flex:1;display:none;flex-direction:column;min-height:0;position:relative}
.view.on{display:flex}

/* capture */
.finder{flex:1;position:relative;margin:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));border-radius:var(--r);overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.app[data-dir="signal"] .finder{border-width:2px}
.finder video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.finder .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.empty h1{font-family:var(--f-mark);font-weight:400;font-size:clamp(34px,9vw,56px);line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
.app[data-dir="signal"] .empty h1{font-weight:700;letter-spacing:-.05em}
.empty h1 em{color:var(--accent);font-style:italic}
.app[data-dir="signal"] .empty h1 em{font-style:normal;background:var(--accent);color:var(--fg);padding:0 .12em;border-radius:.15em}
.empty p{margin:0;color:var(--muted);max-width:30ch;font-size:15px;line-height:1.45}
.ways{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-size:14px;display:inline-flex;align-items:center;gap:6px;color:var(--fg);text-decoration:none}
.app[data-dir="signal"] .chip{border-width:2px;font-weight:500}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.corner{position:absolute;width:26px;height:26px;border-color:var(--accent);border-style:solid;opacity:.8;pointer-events:none}
.c1{top:14px;left:14px;border-width:2px 0 0 2px}.c2{top:14px;right:14px;border-width:2px 2px 0 0}.c3{bottom:14px;left:14px;border-width:0 0 2px 2px}.c4{bottom:14px;right:14px;border-width:0 2px 2px 0}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .35s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}

.dock{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
  padding:16px max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(20px,env(safe-area-inset-left,0px))}
.dock .l{justify-self:start;display:flex;gap:10px}.dock .r{justify-self:end;display:flex;gap:10px}
.shutter{width:84px;height:84px;border-radius:50%;border:3px solid var(--fg);background:transparent;display:grid;place-items:center;padding:0;position:relative;user-select:none;-webkit-user-select:none;touch-action:none}
.shutter::after{content:"";width:66px;height:66px;border-radius:50%;background:var(--accent);transition:transform .15s}
.shutter:active::after,.shutter.held::after{transform:scale(.86)}
.shutter input{position:absolute;inset:0;opacity:0;cursor:pointer}
.app[data-dir="signal"] .shutter{border-color:var(--line)}
.hint{text-align:center;color:var(--muted);font-size:13px;padding:0 16px;min-height:18px}

/* compose */
.stagewrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.stage{position:relative;border-radius:var(--r-sm);overflow:hidden;touch-action:none;box-shadow:0 10px 40px rgba(0,0,0,.35);background:#000}
.app[data-dir="signal"] .stage{border:2px solid var(--line);box-shadow:6px 6px 0 var(--line)}
.app[data-dir="paper"] .stage{box-shadow:0 1px 2px rgba(0,0,0,.12),0 12px 30px rgba(20,30,60,.12);transform:rotate(-.4deg)}
.stage img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--pin);color:var(--pin-ink);font-weight:600;font-size:15px;display:grid;place-items:center;
  border:2px solid var(--pin-ink);box-shadow:0 3px 10px rgba(0,0,0,.35);animation:drop .28s cubic-bezier(.3,1.6,.5,1);padding:0}
.pin.active{outline:3px solid var(--pin);outline-offset:3px}
.app[data-dir="paper"] .pin{font-family:var(--f-note);font-size:22px}
@keyframes drop{from{transform:scale(0)}to{transform:scale(1)}}

.sheet{background:var(--surface);border-top:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.app[data-dir="signal"] .sheet{border-top-width:2px}
.app[data-dir="paper"] .sheet{background-image:repeating-linear-gradient(transparent 0 31px,#dfe6f5 31px 32px);background-position:0 18px}
.tools{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tools .chip{flex:none;padding:6px 12px;font-size:13px}
.tools .sep{width:1px;height:20px;background:var(--line);flex:none;margin:0 2px}
.targets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.targets::-webkit-scrollbar{display:none}
.tg{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
.tg.on{border-color:var(--accent);color:var(--fg);background:color-mix(in srgb,var(--accent) 18%,transparent)}
.noterow{display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;min-width:0;resize:none;border:0;background:transparent;color:var(--fg);font:inherit;font-family:var(--f-note);font-size:17px;line-height:1.45;min-height:52px;max-height:30vh;padding:6px 2px}
.app[data-dir="paper"] textarea{font-size:24px;line-height:32px;color:var(--accent)}
textarea::placeholder{color:var(--muted)}
.partial{color:var(--muted)}
.mic{width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.mic svg{width:24px;height:24px}
.mic.live::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent);animation:ring 1.1s ease-out infinite}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.35);opacity:0}}
.app[data-dir="signal"] .mic{border:2px solid var(--line)}
.actions{display:flex;gap:10px;align-items:center}
.send{flex:1;height:52px;border-radius:999px;border:0;background:var(--fg);color:var(--bg);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.app[data-dir="signal"] .send{background:var(--line);color:var(--surface)}
.ghost{height:52px;border-radius:999px;border:1px solid var(--line);background:transparent;padding:0 18px;font-size:15px}

/* send panel */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.panel{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);color:var(--fg);border-radius:var(--r) var(--r) 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .26s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.app[data-dir="signal"] .panel{border:2px solid var(--line);border-bottom:0}
.panel h2{margin:0;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.cardprev{width:100%;border-radius:var(--r-sm);border:1px solid var(--line);display:block;max-height:38vh;object-fit:contain;background:var(--bg)}
.dests{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dest{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;background:transparent;text-decoration:none;color:var(--fg)}
.app[data-dir="signal"] .dest{border-width:2px}
.dest b{font-weight:600;font-size:15px}.dest span{font-size:12px;color:var(--muted)}
.dest.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dest.primary span{color:inherit;opacity:.75}
.answer{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:15px;line-height:1.5;white-space:pre-wrap;max-height:40vh;overflow:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}

/* inbox */
.inbox{flex:1;overflow:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px))}
.inbox h2{font-family:var(--f-mark);font-weight:400;font-size:34px;margin:6px 0 14px}
.app[data-dir="signal"] .inbox h2{font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface);text-align:left;padding:0;display:flex;flex-direction:column}
.item img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.item div{margin:8px 10px 4px;font-size:13px;line-height:18px;height:36px;overflow:hidden}
.item small{display:block;padding:0 10px 8px;color:var(--muted);font-size:11px}
.tag{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:1px 5px;margin-right:4px;vertical-align:1px}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.drop{position:fixed;inset:0;border:3px dashed var(--accent);z-index:30;display:none;place-items:center;font-size:20px;background:color-mix(in srgb,var(--bg) 80%,transparent)}
.drop.on{display:grid}
@media (min-width:900px){
  .view#v-compose{flex-direction:row}
  .view#v-compose .sheet{width:400px;border-radius:var(--r) 0 0 0;border-top:0;border-left:1px solid var(--line);justify-content:flex-end}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app" data-dir="lens">
  <header class="top">
    <button class="mark" id="home" aria-label="Glint, back to camera"><span class="spark" aria-hidden="true"></span><i>Glint</i></button>
    <div class="top-r">
      <button class="iconbtn" id="dirBtn" aria-label="Change look" title="Change look">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>
      </button>
      <button class="iconbtn" id="inboxBtn" aria-label="Inbox" title="Inbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 14h5l1.5 2h5L16 14h5"/></svg>
        <span class="badge" id="count" hidden>0</span>
      </button>
    </div>
  </header>

  <!-- 1. capture -->
  <section class="view on" id="v-capture" aria-label="Capture">
    <div class="finder" id="finder">
      <video id="video" playsinline muted autoplay hidden></video>
      <div class="empty" id="finderEmpty">
        <h1>See it. <em>Say it.</em> Send it.</h1>
        <p id="finderMsg">Tap the shutter to take a photo. Then tap the picture where you mean and say what you want.</p>
        <div class="ways">
          <label class="chip btn" for="pickFile">Photo or screenshot<input type="file" id="pickFile" accept="image/*" hidden></label>
          <button class="chip" id="screenBtn" hidden>Grab screen</button>
          <button class="chip" id="sampleBtn">Try the sample</button>
        </div>
      </div>
      <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
      <div class="flash" id="flash"></div>
    </div>
    <p class="hint" id="capHint">Paste (Ctrl/⌘ V) or drop an image anywhere, too.</p>
    <div class="dock">
      <div class="l"></div>
      <label class="shutter" id="shutter" aria-label="Take photo">
        <input type="file" id="camFile" accept="image/*" capture="environment">
      </label>
      <div class="r"></div>
    </div>
  </section>

  <!-- 2. compose -->
  <section class="view" id="v-compose" aria-label="Add your note">
    <div class="stagewrap" id="stagewrap">
      <div class="stage" id="stage">
        <img id="photo" alt="Your capture">
        <canvas id="ink"></canvas>
        <div id="pins"></div>
      </div>
    </div>
    <div class="sheet">
      <div class="tools" role="toolbar" aria-label="Markup">
        <button class="chip on" data-mode="pin">● Pin</button>
        <button class="chip" data-mode="draw">✎ Draw</button>
        <span class="sep"></span>
        <button class="chip" id="undoBtn">Undo</button>
        <button class="chip" id="discardBtn">Discard</button>
      </div>
      <div class="targets" id="targets"></div>
      <div class="noterow">
        <textarea id="note" rows="2" placeholder="Hold the mic and talk, or type. Tap the picture to pin a spot."></textarea>
        <button class="mic" id="mic" aria-label="Hold to talk">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
      </div>
      <div class="actions">
        <button class="ghost" id="newBtn" aria-label="New capture">New</button>
        <button class="send" id="sendBtn">Send</button>
      </div>
    </div>
  </section>

  <!-- 3. inbox -->
  <section class="view" id="v-inbox" aria-label="Inbox">
    <div class="inbox">
      <h2>Inbox</h2>
      <p class="hint" style="text-align:left;padding:0;margin:-6px 0 14px">Saved on this device only. Nothing leaves it until you send.</p>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <div class="scrim" id="scrim">
    <div class="panel" role="dialog" aria-modal="true" aria-label="Send">
      <h2>Your card</h2>
      <img class="cardprev" id="cardPrev" alt="Card preview: your photo with pins and note">
      <div class="row">
        <label class="toggle"><input type="checkbox" id="wm" checked> Small Glint mark on the card</label>
      </div>
      <h2>Send to</h2>
      <div class="dests" id="dests"></div>
      <div class="answer" id="answer" hidden></div>
      <div class="row"><button class="ghost" id="closePanel">Back to edit</button></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="drop" id="drop">Drop to capture</div>
</div>

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const app = $("#app");
const DIRS = ["lens", "paper", "signal"];
const DIR_NAMES = { lens: "Lens", paper: "Paper", signal: "Signal" };
const store = {
  get(k, d) { try { const v = localStorage.getItem("glint:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("glint:" + k, JSON.stringify(v)); } catch {} }
};

/* ---------- Platform: what this device/host can do. Every feature checks here. ---------- */
const P = {
  claude: null, dictation: null, sample: null, sampleImages: false, downloads: null,
  liveCam: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && !window.claude,
  screen: !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) && !window.claude && !/Mobi|Android/i.test(navigator.userAgent),
  webSpeech: !window.claude && (window.SpeechRecognition || window.webkitSpeechRecognition) || null,
  shareFiles: false
};
try { P.shareFiles = !window.claude && !!navigator.canShare && navigator.canShare({ files: [new File([""], "x.png", { type: "image/png" })] }); } catch {}

/* ---------- Storage: IndexedDB, local-first ---------- */
const DB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error("no idb"));
    const r = indexedDB.open("glint", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("captures", { keyPath: "id" });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));

/* ---------- Capture sources ---------- */
let stream = null;

    await new Promise(r => setTimeout(r, 300)); const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext("2d").drawImage(v, 0, 0);

let photoURL = null;

}

const css = n => getComputedStyle(app).getPropertyValue(n).trim();

  mk("note", "Whole picture"); cap.pins.forEach(p => mk(p.n, "Pin " + p.n + (p.text ? " · " + p.text.slice(0, 18) + (p.text.length > 18 ? "…" : "") : "")));

const curText = () => !cap ? "" : target === "note" ? cap.note : (cap.pins.find(p => p.n === target)?.text || "");

$$(".tools [data-mode]").forEach(b => b.onclick = () => { mode = b.dataset.mode; $$(".tools [data-mode]").forEach(x => x.classList.toggle("on", x === b)); toast(mode === "pin" ? "Tap the picture to pin a spot" : "Draw on the picture"); });
const stage = $("#stage"); let drawing = null, downPt = null;

/* ---------- Voice: one interface, three engines (Claude dictation, Web Speech, none → keyboard) ---------- */
const Voice = (() => {
  let base = "", live = false, rec = null, startedAt = 0, holdMode = false;
  const ta = $("#note"), mic = $("#mic");
  const apply = (partial = "") => { const v = (base + (partial ? (base && !/\s$/.test(base) ? " " : "") + partial : "")); ta.value = v; setCurText(v); if (target !== "note") renderTargets(); ta.scrollTop = ta.scrollHeight; };
  const commit = t => { if (!t) return; base = base + (base && !/\s$/.test(base) ? " " : "") + t.trim(); apply(); };
  const setLive = on => { live = on; mic.classList.toggle("live", on); mic.setAttribute("aria-label", on ? "Listening, tap to stop" : "Hold to talk"); };
  function available() { return !!(P.dictation || P.webSpeech); }
  function start(fresh) {
    if (live) return; base = fresh ? "" : curText(); if (fresh) pendingNote = ""; startedAt = Date.now(); setLive(true);
    if (P.dictation) { P.dictation.start().catch(err => { setLive(false); if (err?.code === "not_granted") { P.dictation = null; toast("Microphone is off. You can still type."); } }); return; }
    if (P.webSpeech) {
      rec = new P.webSpeech(); rec.continuous = true; rec.interimResults = true; rec.lang = navigator.language || "en-US";
      rec.onresult = e => { let interim = ""; for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) commit(r[0].transcript); else interim += r[0].transcript; } apply(interim); };
      rec.onend = () => { setLive(false); apply(); rec = null; };
      rec.onerror = ev => { if (ev.error === "not-allowed") { P.webSpeech = null; toast("Microphone blocked. You can still type."); } };
      try { rec.start(); } catch { setLive(false); }
      return;
    }
    setLive(false); ta.focus(); toast("Use your keyboard's mic to dictate");
  }
  function stop() { if (!live) return; if (P.dictation) P.dictation.stop().catch(() => {}); else if (rec) rec.stop(); setLive(false); }
  function wireDictation(d) {
    d.onPartial(({ text }) => apply(text));
    d.onFinal(({ text }) => commit(text));
    d.onState(({ state }) => { if (state === "idle") { setLive(false); apply(); } else setLive(true); });
  }
  // Mic button: hold = push-to-talk; quick tap = toggle.
  mic.addEventListener("pointerdown", e => { e.preventDefault(); if (live) { holdMode = false; stop(); return; } holdMode = true; start(); });
  mic.addEventListener("pointerup", () => { if (holdMode && Date.now() - startedAt > 450) stop(); holdMode = false; });
  mic.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); live ? stop() : start(); } });
  return { available, start, stop, wireDictation };
})();

/* ---------- Output: the card (image + pins + prompt burned in) and the prompt text ---------- */
function promptText(c) {
  const lines = [];
  if (c.note.trim()) lines.push(c.note.trim());
  const pins = c.pins.filter(p => p.text.trim());
  if (pins.length) { lines.push(""); lines.push("Pinned spots (numbered on the image):"); pins.forEach(p => lines.push(`${p.n}. ${p.text.trim()}  [at ${Math.round(p.x * 100)}% across, ${Math.round(p.y * 100)}% down]`)); }
  const emptyPins = c.pins.filter(p => !p.text.trim()); if (emptyPins.length) lines.push(`Also see pin${emptyPins.length > 1 ? "s" : ""} ${emptyPins.map(p => p.n).join(", ")} on the image.`);
  if (!lines.length) lines.push("Take a look at this image and tell me what stands out.");
  return lines.join("\n");
}
function wrapLines(ctx, text, maxW) {
  const out = []; text.split("\n").forEach(par => { const words = par.split(/\s+/); let line = "";
    words.forEach(w => { const t = line ? line + " " + w : w; if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; }); out.push(line); });

  let iw = W; if (ih > maxH) { iw = Math.round(W * maxH / ih); ih = maxH; }
  const pad = 56, noteFont = `${app.dataset.dir === "paper" ? 50 : 40}px ${css("--f-note")}`, pinFont = `${app.dataset.dir === "paper" ? 42 : 32}px ${css("--f-note")}`;
  const m = document.createElement("canvas").getContext("2d");
  m.font = noteFont; const noteL = c.note.trim() ? wrapLines(m, c.note.trim(), W - pad * 2) : [];
  m.font = pinFont; const pinL = c.pins.filter(p => p.text.trim()).map(p => ({ n: p.n, l: wrapLines(m, p.text.trim(), W - pad * 2 - 64) }));
  const nlh = app.dataset.dir === "paper" ? 60 : 54, plh = app.dataset.dir === "paper" ? 50 : 44;
  let textH = noteL.length * nlh + pinL.reduce((s, p) => s + p.l.length * plh + 18, 0) + (noteL.length && pinL.length ? 20 : 0);

  x.fillStyle = css("--surface"); x.fillRect(0, 0, W, H);
  const ox = Math.round((W - iw) / 2); x.fillStyle = "#000"; x.fillRect(0, 0, W, ih); x.drawImage(bmp, ox, 0, iw, ih);
  x.save(); x.translate(ox, 0); x.lineCap = x.lineJoin = "round"; x.strokeStyle = css("--ink"); x.lineWidth = Math.max(6, iw / 140); c.strokes.forEach(s => strokePath(x, s, iw, ih)); x.restore();

    x.fillStyle = css("--pin-ink"); x.font = `600 ${Math.round(r * 1.05)}px ${css("--f-ui")}`; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(String(n), cx, cy + 1); };
  c.pins.forEach(p => pinDot(ox + p.x * iw, p.y * ih, p.n, 30));
  let y = ih + pad; x.textAlign = "left"; x.textBaseline = "alphabetic";
  x.fillStyle = css("--fg"); x.font = noteFont; noteL.forEach(l => { y += nlh * .8; x.fillText(l, pad, y); y += nlh * .2; });
  if (noteL.length && pinL.length) y += 20;
  pinL.forEach(p => { pinDot(pad + 22, y + plh * .5, p.n, 22); x.textAlign = "left"; x.textBaseline = "alphabetic"; x.fillStyle = css("--fg"); x.font = pinFont; p.l.forEach(l => { y += plh * .8; x.fillText(l, pad + 64, y); y += plh * .2; }); y += 18; });
  if (mark) { x.textBaseline = "alphabetic"; x.fillStyle = css("--muted"); x.font = `italic 30px ${css("--f-mark")}`; x.textAlign = "right"; x.fillText("✦ glint", W - pad, H - 28); }
  return new Promise(r => cv.toBlob(r, "image/png"));
}

  const all = await DB.all(); const g = $("#grid"); g.innerHTML = "";
  if (!all.length) g.innerHTML = `<p class="hint" style="text-align:left">Nothing yet. Your captures land here.</p>`;
  all.forEach(c => { const b = document.createElement("button"); b.className = "item"; const im = document.createElement("img"); im.alt = ""; im.src = URL.createObjectURL(c.img); b.appendChild(im);
    const d = document.createElement("div"); d.innerHTML = c.example ? `<span class="tag">Example</span>` : ""; d.append(c.note || c.pins.map(p => p.text).filter(Boolean).join(" · ") || "No note yet"); b.appendChild(d);
    const s = document.createElement("small"); s.textContent = new Date(c.created).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) + (c.pins.length ? ` · ${c.pins.length} pin${c.pins.length > 1 ? "s" : ""}` : "") + (c.sent.length ? " · sent" : ""); b.appendChild(s);
    b.onclick = () => { cap = c; target = "note"; openCompose(); }; g.appendChild(b); });
  show("inbox");
};

/* ---------- Sample (example capture so the tool shows what it does) ---------- */
async function sampleBlob() {
  const c = document.createElement("canvas"); c.width = 900; c.height = 1500; const x = c.getContext("2d");
  x.fillStyle = "#f6f6f8"; x.fillRect(0, 0, 900, 1500);
  x.fillStyle = "#ffffff"; x.fillRect(0, 0, 900, 140); x.fillStyle = "#111"; x.font = "600 44px system-ui"; x.fillText("Brewlist", 56, 92);
  x.fillStyle = "#c9ccd3"; [0, 1, 2].forEach(i => x.fillRect(700 + i * 0, 66 + i * 16, 120, 6));
  const g = x.createLinearGradient(0, 200, 900, 760); g.addColorStop(0, "#3b2a1e"); g.addColorStop(1, "#a0673a"); x.fillStyle = g; x.beginPath(); x.roundRect(48, 190, 804, 560, 28); x.fill();
  x.fillStyle = "rgba(255,255,255,.92)"; x.font = "700 64px system-ui"; x.fillText("Every bean,", 96, 600); x.fillText("one list.", 96, 676);
  x.fillStyle = "#111"; x.font = "500 34px system-ui"; x.fillText("Track the coffees you love and", 56, 840); x.fillText("where to buy them again.", 56, 888);
  x.fillStyle = "#e6e8ee"; x.beginPath(); x.roundRect(56, 960, 788, 96, 18); x.fill(); x.fillStyle = "#8a8f99"; x.font = "400 32px system-ui"; x.fillText("Email address", 92, 1018);
  x.fillStyle = "#c8ccd4"; x.beginPath(); x.roundRect(560, 1100, 284, 84, 42); x.fill(); x.fillStyle = "#fff"; x.font = "600 30px system-ui"; x.fillText("Join", 668, 1153);
  x.fillStyle = "#9aa0aa"; x.font = "400 26px system-ui"; x.fillText("Terms · Privacy · © 2026", 56, 1420);
  return new Promise(r => c.toBlob(r, "image/png"));
}
async function loadSample(open = true) {
  const b = await sampleBlob();
  const c = { id: "example", created: Date.now() - 60000, img: b, w: 900, h: 1500, example: true, sent: [], strokes: [],
    note: "Turn this into a working signup page in React + Tailwind. Keep the hero, make it feel premium.",
    pins: [{ n: 1, x: .78, y: .752, text: "Button looks disabled. Make it the brand brown and full width." }, { n: 2, x: .2, y: .675, text: "Validate the email inline." }] };
  await DB.put(c); refreshCount();
  if (open) { cap = c; target = "note"; await openCompose(); }
}
$("#sampleBtn").onclick = () => loadSample(true);

/* ---------- Boot: light up host capabilities when present ---------- */
(async () => {
  if (P.liveCam) $("#capHint").textContent = "Tap to shoot · Hold to shoot and talk";
  if (!P.liveCam) $("#capHint").textContent = "Tap the shutter to open your camera. Paste or drop an image, too.";
  if (!P.webSpeech && !window.claude) {} // keyboard dictation fallback
  const all = await DB.all(); if (!all.length && !store.get("seeded", false)) { store.set("seeded", true); await loadSample(false); }
  refreshCount(); updateSendLabel(); startCam();
  // shared-in image (PWA share target)
  if (location.search.includes("shared=1") && "caches" in window) { try { const c = await caches.open("glint-share"); const r = await c.match("shared-image"); if (r) { await c.delete("shared-image"); loadBlob(await r.blob()); } } catch {} }
  if (window.claude?.use) {
    const [d, s, dl] = await Promise.all([window.claude.use("dictation").catch(() => null), window.claude.use("sample").catch(() => null), window.claude.use("downloads").catch(() => null)]);
    if (d) { P.dictation = d; Voice.wireDictation(d); }
    if (s) { P.sample = s; try { const lim = await s.limits(); P.sampleImages = !!lim?.images; } catch {} }
    if (dl) P.downloads = dl;
    updateSendLabel();
  }
})();
window.Glint = { get cap() { return cap; }, promptText, renderCard, loadSample, P };
})();
