s of psychoactive drugs (especially LSD) and other chemicals without the subjects' consent. Additionally, other methods beyond chemical compounds were used, including electroshocks, hypnosis, sensory deprivation, isolation, verbal and sexual abuse, and other forms of torture."]},"midnight":{"title":"Operation Midnight Climax","url":"https://en.wikipedia.org/wiki/Operation_Midnight_Climax","paras":["Operation Midnight Climax was a Central Intelligence Agency (CIA) sub-project of the illegal Project MKUltra, the CIA mind-control research program that began in the 1950s. It was initially established in 1954 by Sidney Gottlieb and placed under the direction of the Federal Bureau of Narcotics in Boston, Massachusetts with the \"Federal Narcotics Agent and CIA consultant\" George Hunter White under the pseudonym of Morgan Hall.","Gottlieb was a chemist who was chief of the Chemical Division of the Office of Technical Service of the CIA. He based his plan for MKUltra and Midnight Climax on interrogation method research under Project Artichoke. Unlike Artichoke, Midnight Climax gave Gottlieb permission to test drugs on unknowing citizens, which created the infamous legacy of this operation. Hundreds of federal agents, field operatives, and scientists worked on these programs before they were shut down in the 1960s."]},"stargate":{"title":"Stargate Project","url":"https://en.wikipedia.org/wiki/Stargate_Project","paras":["Stargate Project (U.S. Army unit), a secret US Army unit established in 1977","Stargate LLC, an American multinational artificial intelligence joint venture founded in 2025"]},"acoustickitty":{"title":"Acoustic Kitty","url":"https://en.wikipedia.org/wiki/Acoustic_Kitty","paras":["Acoustic Kitty was a Central Intelligence Agency (CIA) project launched by the Directorate of Science & Technology in the 1960s, which was intended to use cats to spy on the Kremlin and Soviet embassies."]},"northwoods":{"title":"Operation Northwoods","url":"https://en.wikipedia.org/wiki/Operation_Northwoods","paras":["Operation Northwoods was a proposed false flag operation which originated within the Department of Defense of the US government in 1962. The proposals called for Central Intelligence Agency (CIA) operatives to both stage and commit acts of terrorism against US military and civilian targets, blame them on the Cuban government, and use them to justify a war against Cuba. The possibilities detailed in the document included the remote control of civilian aircraft which would be secretly repainted as US Air Force planes, a fabricated 'shoot down' of a US Air Force fighter aircraft off the coast of Cuba, the possible assassination of Cuban immigrants, sinking boats of Cuban refugees on the high seas, exploding a US ship, and orchestrating terrorism in US cities. The proposals were rejected by US President John F. Kennedy."]},"tonkin":{"title":"Gulf of Tonkin incident","url":"https://en.wikipedia.org/wiki/Gulf_of_Tonkin_incident","paras":["The Gulf of Tonkin incident (Vietnamese: Sự kiện Vịnh Bắc Bộ) refers to a naval confrontation in the Gulf of Tonkin off the coast of North Vietnam, which led to the United States engaging more directly in the Vietnam War. On 2 August 1964 there was a clash between a destroyer of the United States Navy that was collecting signals intelligence close to North Vietnamese waters, and three North Vietnamese naval vessels. On the night of 4 August, two US destroyers reported they were attacked by North Vietnamese vessels and that they were returning fire. Later investigation revealed that the 4 August attack did not happen; no North Vietnamese vessels had been present. Shortly after the events, the National Security Agency, an agency of the US Defense Department, deliberately skewed intelligence to create the impression that an attack had been carried out."]},"nayirah":{"title":"Nayirah testimony","url":"https://en.wikipedia.org/wiki/Nayirah_testimony","paras":["The Nayirah testimony was false testimony given before the United States Congressional Human Rights Caucus on October 10, 1990, by a 15-year-old Kuwaiti girl who was publicly identified only as Nayirah at the time, and presented herself as having been a volunteer nurse at a Kuwaiti hospital at the time of the Iraqi invasion of Kuwait. In her testimony, which took place two months after the invasion, she claimed to have witnessed Iraqi soldiers taking premature babies out of incubators in a maternity ward before looting the incubators and leaving the babies to die on the floor. Nayirah's statements were widely publicized and cited numerous times in the United States Senate and by American president George H. W. Bush to contribute to the rationale for pursuing military action against Iraq. Her portrayal of Iraqi war crimes was aimed at further increasing global support for Kuwait against the Iraqi occupation during the Gulf War, which resulted in the expulsion of Iraqi troops from Kuwait by a 42-country coalition led by the United States."]},"mincemeat":{"title":"Operation Mincemeat","url":"https://en.wikipedia.org/wiki/Operation_Mincemeat","paras":["Operation Mincemeat was a successful British deception operation of the Second World War to disguise the 1943 Allied invasion of Sicily. Two members of British intelligence obtained the body of Glyndwr Michael, a tramp who died from eating rat poison, dressed him as an officer of the Royal Marines and placed personal items on him identifying him as the fictitious Captain (Acting Major) William Martin. Correspondence between two British generals that suggested that the Allies planned to invade Greece and Sardinia, with Sicily as merely the target of a feint, was also placed on the body."]},"ghostarmy":{"title":"Ghost Army","url":"https://en.wikipedia.org/wiki/Ghost_Army","paras":["The Ghost Army was a United States Army tactical deception unit during World War II officially known as the 23rd Headquarters Special Troops. The 1,100-man unit was created to deceive the Axis forces and mislead them as to the size and location of Allied forces, while giving the actual units elsewhere time to maneuver. Activated on 20 January 1944, the Ghost Army arrived in Europe in May shortly before D-Day and returned to the US at the end of the war in July 1945. During their tenure, the Ghost Army carried out more than 20 deception campaigns, putting on a \"traveling road show\" using inflatable tanks, sound trucks, fake radio transmissions, scripts and pretense.","Their story was kept a secret for more than 50 years after the war, until it was declassified in 1996. The unit was the subject of a PBS documentary The Ghost Army in 2013. In February 2022, members of the Ghost Army were awarded the Congressional Gold Medal for their service."]},"roswell":{"title":"Roswell incident","url":"https://en.wikipedia.org/wiki/Roswell_incident","paras":["Debris found by a rancher in 1947 near Roswell, New Mexico, has become the basis for UFO conspiracy theories alleging that the United States military recovered a crashed extraterrestrial spacecraft. After metallic and rubber debris was recovered by Roswell Army Air Field personnel, the United States Army Air Forces announced possession of a \"flying disc\". This announcement made international headlines, but was retracted within a day. In reality, the debris was from a complex uncrewed military balloon train, consisting of linked balloons and assorted equipment, operated from the nearby Alamogordo Army Air Field as part of the top-secret Project Mogul, a program intended to detect Soviet nuclear tests. To obscure the purpose and source of the debris, the army reported that it was merely a conventional weather balloon."]},"area51":{"title":"Area 51","url":"https://en.wikipedia.org/wiki/Area_51","paras":["Area 51 is a highly classified United States Air Force (USAF) facility within the Nevada Test and Training Range in southern Nevada, 83 miles (134 km) north-northwest of Las Vegas.","A remote detachment administered by Edwards Air Force Base, the facility is officially called Homey Airport (ICAO: KXTA, FAA LID: XTA) or Groom Lake (after the salt flat next to its airfield). Details of its operations are not made public, but the USAF says that it is an open training range, and it is commonly thought to support the development and testing of experimental aircraft and weapons. The USAF and U.S. Central Intelligence Agency (CIA) acquired the site in 1955, primarily for flight tests of the Lockheed U-2 aircraft."]},"bluebook":{"title":"Project Blue Book","url":"https://en.wikipedia.org/wiki/Project_Blue_Book","paras":["Project Blue Book was the code name for the systematic study of unidentified flying objects (UFOs) by the United States Air Force from March 1952 to its termination on December 17, 1969. The project, headquartered at Wright-Patterson Air Force Base, Ohio, was initially directed by Captain Edward J. Ruppelt and followed projects of a similar nature such as Project Sign established in 1947, and Project Grudge in 1949. Project Blue Book had two goals, namely, to determine if UFOs were a threat to national security, and to scientifically analyze UFO-related data.","Thousands of UFO reports were collected, analyzed, and filed. As a result of the Condon Report, which concluded that the study of UFOs was unlikely to yield major scientific discoveries, and a review of the report by the National Academy of Sciences, Project Blue Book was terminated in 1969. The Air Force supplies the following summary of its investigations:","No UFO reported, investigated, and evaluated by the Air Force was ever an indication of threat to our national security;"]},"tictac":{"title":"Pentagon UFO videos","url":"https://en.wikipedia.org/wiki/Pentagon_UFO_videos","paras":["The Pentagon UFO videos are selected visual recordings of forward-looking infrared (FLIR) targeting cameras from United States Navy fighter jets based aboard the aircraft carriers USS Nimitz and USS Theodore Roosevelt in 2004, 2014 and 2015, with additional footage taken by other Navy personnel in 2019. The four Infrared videos taken from aircraft's targeting pod have been widely characterized as officially documenting UFOs and received extensive coverage in the media since 2017. The Pentagon later addressed and officially released the first three videos of unidentified aerial phenomena (UAP) in 2020, and confirmed the provenance of the leaked 2019 videos in two statements made in 2021. Footage of UAPs was also released in 2023, sourced from MQ-9 military drones."]},"wow":{"title":"Wow! signal","url":"https://en.wikipedia.org/wiki/Wow%21_signal","paras":["The Wow! signal was a strong narrowband radio signal detected on August 15, 1977, by Ohio State University's Big Ear radio telescope in the United States, then used to support the search for extraterrestrial intelligence. The signal appeared to come from the direction of the constellation Sagittarius and bore expected hallmarks of extraterrestrial origin.","Astronomer Jerry R. Ehman discovered the anomaly a few days later while reviewing the recorded data. On the computer printout, he circled the reading of the signal's intensity, \"6EQUJ5\", and wrote the comment \"Wow!\" beside it, leading to the event's widely used name."]},"cointelpro":{"title":"COINTELPRO","url":"https://en.wikipedia.org/wiki/COINTELPRO","paras":["COINTELPRO (a syllabic abbreviation derived from Counter Intelligence Program) was a series of covert projects conducted between 1956 and 1971 by the United States Federal Bureau of Investigation (FBI) aimed at surveilling, infiltrating, discrediting, and disrupting American political parties and organizations that the FBI perceived as subversive."]},"mockingbird":{"title":"Operation Mockingbird","url":"https://en.wikipedia.org/wiki/Operation_Mockingbird","paras":["Operation Mockingbird is an alleged large-scale program of the United States Central Intelligence Agency (CIA) that began in the early years of the Cold War and attempted to manipulate domestic American news media organizations for propaganda purposes. According to author Deborah Davis, Operation Mockingbird recruited leading American journalists into a propaganda network and influenced the operations of front groups. CIA support of front groups was exposed when an April 1967 Ramparts article reported that the National Student Association (NSA) received funding from the CIA. In 1975, Church Committee Congressional investigations revealed Agency connections with journalists and civic groups."]},"jfk":{"title":"United States House Select Committee on Assassinations","url":"https://en.wikipedia.org/wiki/United_States_House_Select_Committee_on_Assassinations","paras":["The United States House of Representatives Select Committee on Assassinations (HSCA) was established on September 15, 1976, by U.S. House Resolution 1540 to investigate the assassinations of John F. Kennedy and Martin Luther King Jr. in 1963 and 1968, respectively. The select committee was first formed by the 94th United States Congress, and expired at the end of the 95th Congress."]},"tuskegee":{"title":"Tuskegee Syphilis Study","url":"https://en.wikipedia.org/wiki/Tuskegee_Syphilis_Study","paras":["The Tuskegee Study of Untreated Syphilis in the Negro Male (informally referred to as the Tuskegee Experiment or Tuskegee Syphilis Study) was a study conducted between 1932 and 1972 by the United States Public Health Service (PHS) and the Centers for Disease Control and Prevention (CDC) on a group of 399 African American men with syphilis as well as a control group without. The purpose of the study was to observe the effects of the disease when untreated, to the point of death and autopsy. Although there had been effective treatments to reduce the severity of the disease since the 1920s, the use of penicillin for the treatment of syphilis was widespread as of 1945. The men were not informed of the nature of the study, proper treatment was withheld, and more than 100 died as a result."]},"seaspray":{"title":"Operation Sea-Spray","url":"https://en.wikipedia.org/wiki/Operation_Sea-Spray","paras":["Operation Sea-Spray was a 1950 U.S. Navy secret biological warfare experiment in which Serratia marcescens and Bacillus globigii bacteria were sprayed over the San Francisco Bay Area in California in order to determine how vulnerable a city like San Francisco would be to a bioweapon attack. There has been speculation that the experiment may have contributed to one death and at least ten illnesses."]},"paperclip":{"title":"Operation Paperclip","url":"https://en.wikipedia.org/wiki/Operation_Paperclip","paras":["Operation Paperclip was a secret United States intelligence program in which more than 1,600 German scientists, engineers, and technicians were taken from former Nazi Germany to the US between 1945 and 1959 for government employment after the end of World War II in Europe; several were confirmed to be former members of the Nazi Party, including the SS or the SA."]},"moon":{"title":"Moon landing conspiracy theories","url":"https://en.wikipedia.org/wiki/Moon_landing_conspiracy_theories","paras":["Conspiracy theories claim that some or all elements of the Apollo program and the associated Moon landings were hoaxes staged by NASA, possibly with the aid of other organizations. Such views are considered fringe. The most notable claim of these conspiracy theories is that the six crewed landings (1969–1972) were faked and that twelve Apollo astronauts did not actually land on the Moon. Since the mid-1970s, various groups and individuals have claimed that NASA and others knowingly misled the public into believing the landings happened by manufacturing, tampering with, or destroying evidence including photos, telemetry tapes, radio and TV transmissions, and Moon rock samples."]},"philadelphia":{"title":"Philadelphia Experiment","url":"https://en.wikipedia.org/wiki/Philadelphia_Experiment","paras":["The Philadelphia Experiment was an alleged event claimed to have been witnessed by an ex-merchant mariner named Carl M. Allen at the United States Navy's Philadelphia Naval Shipyard in Philadelphia, Pennsylvania, United States, some time around October 28, 1943. Allen described an experiment where the U.S. Navy attempted to make a destroyer escort, USS Eldridge, disappear and the bizarre results that followed.","The story surfaced in late 1955 when Allen sent a book full of hand-written annotations referring to the experiment to a U.S. Navy research organization and, a little later, a series of letters making further claims to a UFO author. Allen's account of the event is widely understood to be a hoax.","Several different—and sometimes contradictory—versions of the alleged experiment have circulated over the years in paranormal literature and popular movies. The U.S. Navy maintains that no such experiment was ever conducted, that the details of the story contradict well-established facts about USS Eldridge, and that the physics the experiment is claimed to be based on are non-existent."]},"bermuda":{"title":"Bermuda Triangle","url":"https://en.wikipedia.org/wiki/Bermuda_Triangle","paras":["The Bermuda Triangle, also known as the Devil's Triangle, is a loosely defined region in the North Atlantic Ocean, roughly bounded by Florida, Bermuda, and Puerto Rico. Since the mid-20th century, it has been the focus of an urban legend suggesting that many aircraft, ships, and people have disappeared there under mysterious circumstances. However, extensive investigations by reputable sources, including the U.S. federal government and scientific organizations, have found no evidence of unusual activity, attributing reported incidents to natural phenomena, human error, and misinterpretation."]},"pauldead":{"title":"Paul is dead","url":"https://en.wikipedia.org/wiki/Paul_is_dead","paras":["\"Paul is dead\" is an urban legend and conspiracy theory alleging that English musician Paul McCartney of the Beatles died in 1966 and was secretly replaced by a look-alike. The rumour began circulating in 1966, gaining broad popularity in September 1969 following reports on American college campuses. Rumours declined after Life published an interview with McCartney in November 1969.","According to the story, McCartney died in a car crash, and, to spare the public from grief, the surviving Beatles, aided by Britain's MI5, replaced him with a McCartney look-alike, subsequently communicating this secret through subtle details of their albums. Proponents perceived clues among elements of Beatles songs and cover artwork; clue-hunting proved infectious, and by October 1969 had become an international phenomenon."]},"birds":{"title":"Birds Aren't Real","url":"https://en.wikipedia.org/wiki/Birds_Aren%27t_Real","paras":["Birds Aren't Real is a satirical conspiracy theory which posits that birds are actually drones operated by the United States government to spy on American citizens. In 2018, journalist Rachel Roberts described Birds Aren't Real as \"a joke that thousands of people are in on\"."]},"havana":{"title":"Havana syndrome","url":"https://en.wikipedia.org/wiki/Havana_syndrome","paras":["Havana syndrome, also known as anomalous health incidents (AHIs), is a disputed medical condition. Starting in 2016 in about a dozen overseas locations, U.S. and Canadian government officials and their families reported symptoms associated with a perceived localized loud sound. The symptoms lasted for months and included disabling cognitive problems, balance problems, dizziness, insomnia, and headaches. Havana syndrome is not recognized as a disease by the medical community."]},"starfish":{"title":"Starfish Prime","url":"https://en.wikipedia.org/wiki/Starfish_Prime","paras":["Starfish Prime was a high-altitude nuclear test conducted by the United States, a joint effort of the United States Atomic Energy Commission (AEC) and the Defense Atomic Support Agency. It was launched from Johnston Atoll on July 9, 1962, and was the largest nuclear test conducted in outer space, and one of five conducted by the US in space.","A Thor rocket carrying a W49 thermonuclear warhead (designed at Los Alamos Scientific Laboratory) and a Mk. 2 reentry vehicle was launched from Johnston Atoll in the Pacific Ocean, about 900 miles (1,450 km) west-southwest of Hawaii. The explosion took place at an altitude of 250 miles (400 km), above a point 19 miles (31 km) southwest of Johnston Atoll. It had a yield of 1.4 Mt (5.9 PJ). The explosion was about 10° above the horizon as seen from Hawaii, at 11 pm Hawaii time."]},"a119":{"title":"Project A119","url":"https://en.wikipedia.org/wiki/Project_A119","paras":["Project A119, also known as A Study of Lunar Research Flights, was a top-secret plan developed in 1958 by the United States Air Force. The aim of the project was to detonate a nuclear bomb on the Moon, which would help in answering some of the mysteries in planetary astronomy and astrogeology. If the explosive device detonated on the surface, and not in a lunar crater, the flash of explosive light would have been faintly visible to people on Earth with their naked eye. This was meant as a show of force resulting in a possible boosting of domestic morale in the capabilities of the United States, a boost that was needed after the Soviet Union took an early lead in the Space Race."]},"iceworm":{"title":"Project Iceworm","url":"https://en.wikipedia.org/wiki/Project_Iceworm","paras":["Project Iceworm was a top secret United States Army program of the Cold War, which aimed to build a network of mobile nuclear missile launch sites under the Greenland ice sheet. The goal was to install a vast network of nuclear missile launch sites that could survive a first strike, according to the Danish Institute for International Studies, which obtained declassified documents in 1996. The missiles, which could strike targets within the Soviet Union, were never fielded and necessary consent from the Danish government to do so was never obtained.","To study the feasibility of working under the ice, a highly publicized \"cover\" project, known as Camp Century, was launched in 1959. Unstable ice conditions within the ice sheet caused the project to be canceled in 1966."]},"azorian":{"title":"Project Azorian","url":"https://en.wikipedia.org/wiki/Project_Azorian","paras":["Project Azorian (also called \"Jennifer\" by the press after its Top Secret Security Compartment) was a U.S. Central Intelligence Agency (CIA) project to recover the sunken Soviet submarine K-129 from the Pacific Ocean floor in 1974 using the purpose-built ship Hughes Glomar Explorer. The 1968 sinking of K-129 occurred about 1,560 miles (2,510 km) northwest of Hawaii. Project Azorian was one of the most complex, expensive, and covert intelligence operations of the Cold War at a cost of about US$800 million (equivalent to $4.1 billion in 2025)."]},"habakkuk":{"title":"Project Habakkuk","url":"https://en.wikipedia.org/wiki/Project_Habakkuk","paras":["Project Habakkuk or Habbakuk (spelling varies) was a plan by the British during the Second World War to construct an aircraft carrier out of pykrete, a mixture of wood pulp and ice, for use against German U-boats in the mid-Atlantic, which were beyond the flight range of land-based planes at that time. The plan was to create what would have been the largest ship ever at 600 metres (1,969 ft) long, which would have been much bigger than even the USS Enterprise and the USS Gerald R. Ford, the largest naval vessel ever, at 342 metres (1,122 ft) long. The idea came from Geoffrey Pyke, who worked for Combined Operations Headquarters. After promising scale tests and the creation of a prototype on Patricia Lake, Jasper National Park, in Alberta, Canada, the project was shelved due to rising costs, added requirements, and the availability of longer-range aircraft and escort carriers which closed the Mid-Atlantic gap that the project was intended to address."]},"washtub":{"title":"Operation Washtub (United States)","url":"https://en.wikipedia.org/wiki/Operation_Washtub_%28United_States%29","paras":["Operation Washtub, also known as STAGE (Stay Behind Agent Program), was a top secret joint operation between the United States Air Force's Office of Special Investigations and the Federal Bureau of Investigation. Officially, its purpose was to build an intelligence network in the event that the Soviet Union invaded and occupied Alaska. Primarily formulated by J. Edgar Hoover and his then protegé Joseph Carroll, the Operation was enacted from 1951 to 1959, when Alaska was granted statehood. The primary objectives of Operation Washtub were fostering potential stay-behind agents in the then Territory of Alaska for covert intelligence gathering, and maintaining evasion and escape facilities for captured friendly American Forces."]},"gladio":{"title":"Operation Gladio","url":"https://en.wikipedia.org/wiki/Operation_Gladio","paras":["Operation Gladio was the codename for clandestine \"stay-behind\" operations of armed resistance that were organized by the Western Union (WU; founded in 1948), and subsequently by NATO (formed in 1949), and by the CIA (established in 1947), in collaboration with several European intelligence agencies during the Cold War. Although Gladio specifically refers to the Italian branch of the NATO stay-behind organizations, Operation Gladio is used as an informal name for all of them. Stay-behind operations were prepared in many NATO member countries, and in some neutral countries."]},"popeye":{"title":"Operation Popeye","url":"https://en.wikipedia.org/wiki/Operation_Popeye","paras":["Operation Popeye / Sober Popeye (Project Controlled Weather Popeye / Motorpool / Intermediary-Compatriot) was a military cloud-seeding project carried out by the U.S. Air Force during the Vietnam War in 1967–1972. The highly classified program attempted to extend the monsoon season over specific areas of the Ho Chi Minh Trail, to disrupt North Vietnamese military supplies by softening road surfaces and causing landslides.","The chemical weather modification program was conducted from Thailand over Cambodia, Laos, and Vietnam and allegedly sponsored by Secretary of State Henry Kissinger and the CIA without the authorization of then Secretary of Defense Melvin Laird, who had categorically denied to Congress that a program for modification of the weather for use as a tactical weapon even existed."]},"shamrock":{"title":"Project SHAMROCK","url":"https://en.wikipedia.org/wiki/Project_SHAMROCK","paras":["Project SHAMROCK was a United States government domestic espionage project operated by the predecessor to the National Security Agency (NSA) between the 1940s and 1970s. Project SHAMROCK was the sister project to Project MINARET, an espionage exercise started in August 1945. Project MINARET involved the accumulation of all telegraphic data that entered or exited the United States. The Armed Forces Security Agency (AFSA) and its successor, the NSA, were given direct access to daily microfilm copies of all incoming, outgoing, and transiting telegrams via the Western Union and its associates RCA and ITT. NSA did the operational interception, and, if there was information that would be of interest to other intelligence agencies, the material was passed to them. Intercepted messages were disseminated to the FBI, CIA, Secret Service, Bureau of Narcotics and Dangerous Drugs (BNDD), and the Department of Defense. No court authorized the operation and there were no warrants."]},"prism":{"title":"PRISM","url":"https://en.wikipedia.org/wiki/PRISM","paras":["PRISM is a code name for a program under which the United States National Security Agency (NSA) collects internet communications from various U.S. internet companies. The program is also known by the SIGAD US-984XN. PRISM collects stored internet communications based on demands made to internet companies such as Google and Apple under Section 702 of the FISA Amendments Act of 2008 to turn over any data that match court-approved search terms. Among other things, the NSA can use these PRISM requests to target communications that were encrypted when they traveled across the internet backbone, to focus on stored data that telecommunication filtering systems discarded earlier, and to get data that is easier to handle."]},"chaos":{"title":"Operation CHAOS","url":"https://en.wikipedia.org/wiki/Operation_CHAOS","paras":["Operation CHAOS or Operation MHCHAOS was a Central Intelligence Agency (CIA) domestic espionage project that targeted American citizens between 1967 and 1974. Established by President Lyndon B. Johnson and expanded under President Richard Nixon, Operation CHAOS had as its alleged mission the uncovering of alleged foreign influence on protest movements concerned with racial equality, anti-war, and other issues, but many scholars describe CHAOS as an \"initiative that aimed to sever links between social movements in the United States and those abroad\".","The operation was launched under Director of Central Intelligence (DCI) Richard Helms by Chief of Counter-Intelligence James Jesus Angleton, and headed by Richard Ober. The CIA cryptonym \"MH\" in the name \"MHCHAOS\" signified that the program had a global area of operations."]},"snowwhite":{"title":"Operation Snow White","url":"https://en.wikipedia.org/wiki/Operation_Snow_White","paras":["Operation Snow White was a criminal conspiracy by the Church of Scientology during the 1970s to purge unfavorable records about Scientology and its founder, L. Ron Hubbard. Carried out by the Church's Guardian's Office, the project included a series of infiltrations into and thefts from 136 government agencies, foreign embassies and consulates, as well as private organizations critical of Scientology, by Church members in more than 30 countries. It was one of the largest infiltrations of the United States government in history, with up to 5,000 covert agents."]},"phoebus":{"title":"Phoebus cartel","url":"https://en.wikipedia.org/wiki/Phoebus_cartel","paras":["The Phoebus cartel was an international cartel that controlled the manufacture and sale of incandescent light bulbs in much of Europe and North America between 1925 and 1939. The cartel took over market territories and lowered the useful life of such bulbs, which is commonly cited as an example of planned obsolescence.","Corporations based in Europe and the United States, including Tungsram, Osram, General Electric, Associated Electrical Industries, and Philips, incorporated the cartel on 15 January 1925 in Geneva, as Phœbus S.A. Compagnie Industrielle pour le Développement de l'Éclairage (French for \"Phoebus plc Industrial Company for the Development of Lighting\"). Although the group had intended the cartel to last for thirty years (1925 to 1955), it ceased operations in 1939 with the outbreak of World War II."]},"radium":{"title":"Radium Girls","url":"https://en.wikipedia.org/wiki/Radium_Girls","paras":["The Radium Girls were female factory workers who contracted radiation poisoning from painting radium dials – watch dials and hands with self-luminous paint. The incidents occurred at three factories in the United States: one in Orange, New Jersey, beginning around 1917; one in Ottawa, Illinois, beginning in the early 1920s; and one in Waterbury, Connecticut, also in the 1920s.","After being told that the paint was harmless, the women in each facility ingested deadly amounts of radium after being instructed to \"point\" their brushes on their lips in order to give them a fine tip. The women were instructed to point their brushes in this way because using rags or a water rinse caused them to use more time and material; the paint was made from powdered radium, zinc sulfide (a phosphor), gum arabic, and water.","The Radium Girls had lasting effects on the labor laws in the United States and Europe due to numerous lawsuits filed after worker deaths and illnesses caused by ingestion of radium."]},"dieselgate":{"title":"Volkswagen emissions scandal","url":"https://en.wikipedia.org/wiki/Volkswagen_emissions_scandal","paras":["The Volkswagen emissions scandal, sometimes known as Dieselgate or Emissionsgate, began in September 2015, when the United States Environmental Protection Agency (EPA) issued a notice of violation of the Clean Air Act to German automaker Volkswagen Group. The agency had found that Volkswagen had intentionally programmed turbocharged direct injection (TDI) diesel engines to activate their emissions controls only during laboratory emissions testing, which caused the vehicles' NOx output to meet US standards during regulatory testing. However, the vehicles emitted up to 40 times more NOx in real-world driving. Volkswagen deployed this software in about 11 million cars worldwide, including 500,000 in the United States, in model years 2009 through 2015."]},"sugar":{"title":"Sugar Association","url":"https://en.wikipedia.org/wiki/Sugar_Association","paras":["The Sugar Association is a trade association for the sugar industry of the United States. Its members include nearly 142,000 growers, processors and refiners of sugar beet and sugarcane plants."]},"dbcooper":{"title":"D. B. Cooper","url":"https://en.wikipedia.org/wiki/D._B._Cooper","paras":["On November 24, 1971, an unidentified man using the alias Dan Cooper, later erroneously known as D. B. Cooper, hijacked Northwest Orient Airlines Flight 305, a Boeing 727 aircraft flying from Portland, Oregon, to Seattle, Washington. Cooper told the flight crew he had a bomb, and demanded $200,000 in ransom (equivalent to $1,600,000 in 2025) and four parachutes upon landing in Seattle.","After releasing the passengers in Seattle, Cooper directed the crew to refuel the aircraft and begin a second flight to Mexico City, with a refueling stop in Reno, Nevada. After taking off from Seattle, Cooper opened the aircraft's aft door, deployed the airstair and parachuted to an uncertain fate over a remote, heavily wooded area of Southwest Washington. Because of a reporter's error, the aircraft hijacker became known as D. B. Cooper. His true identity and fate remain unknown."]},"zodiac":{"title":"Zodiac Killer","url":"https://en.wikipedia.org/wiki/Zodiac_Killer","paras":["The Zodiac Killer (also known by the pseudonym The Zodiac) is an unidentified serial killer who murdered at least five people in the San Francisco Bay Area between December 1968 and October 1969. The Zodiac attacked three couples and a cab driver in Benicia, Vallejo, unincorporated Napa County, and the city of San Francisco. Two of the Zodiac's seven victims survived.","In a series of letters mailed to Bay Area newspapers, the Zodiac took credit for the murders, described details known only to police, threatened bombings and more murders if the newspapers did not print his letters, and included cryptograms with his correspondence. Two of the Zodiac's four cryptograms were decrypted in 1969 and 2020, and the other two remain unsolved. The Zodiac's last letter was received by the San Francisco Chronicle in 1974. In the letter, the Zodiac claimed to have killed 37 people."]},"maryceleste":{"title":"Mary Celeste","url":"https://en.wikipedia.org/wiki/Mary_Celeste","paras":["Mary Celeste (often erroneously referred to as Marie Celeste) was a Canadian-built, American-registered, merchant brigantine that was discovered adrift and deserted in the Atlantic Ocean off the Azores on December 4, 1872.","The Canadian brigantine Dei Gratia found the Mary Celeste in a dishevelled but seaworthy condition under partial sail and with the lifeboat missing. The last entry in the log was dated 10 days earlier. The ship had left New York City for Genoa on November 7 and was still amply provisioned when found. The cargo of alcohol was intact, and the captain's and crew's personal belongings were undisturbed. None of those who had been on board were ever seen or heard from again."]},"voynich":{"title":"Voynich manuscript","url":"https://en.wikipedia.org/wiki/Voynich_manuscript","paras":["The Voynich manuscript (VOY-nitch) is an illustrated codex, hand-written in an undeciphered script referred to as \"Voynichese\". The vellum on which it is written has been carbon-dated to the early 15th century (1404–1438). Stylistic analysis has indicated the manuscript may have been composed in Italy during the Italian Renaissance. The origins, authorship, and purpose of the manuscript are still debated, but currently scholars lack the translation and context needed to either properly entertain or eliminate any of the possibilities. Hypotheses range from a script for a natural language or constructed language, an unreadable code, cipher, or other form of cryptography, or perhaps a hoax, reference work (i.e. folkloric index or compendium), glossolalia, or work of fiction (e.g. science fantasy or mythopoeia, metafiction, and speculative fiction)."]},"dyatlov":{"title":"Dyatlov Pass incident","url":"https://en.wikipedia.org/wiki/Dyatlov_Pass_incident","paras":["The Dyatlov Pass incident (Russian: Гибель тургруппы Дятлова, romanized: Gibel turgruppy Dyatlova, lit. 'Death of the Dyatlov Hiking Group') was an event in which nine Soviet ski hikers died in the northern part of the Ural Mountains ridge in the Russian SFSR on 1 or 2 February 1959 under undetermined circumstances. The experienced trekking group from the Ural Polytechnical Institute embarked on a difficult hike led by Igor Dyatlov, and had established a camp on the eastern slopes of Kholat Syakhl mountain. Overnight, the group cut their way out of their tent with knives and fled the campsite, inadequately dressed for the heavy snowfall, strong winds and extreme cold temperatures as low as −40 °C (−40 °F)."]},"rendlesham":{"title":"Rendlesham Forest incident","url":"https://en.wikipedia.org/wiki/Rendlesham_Forest_incident","paras":["The Rendlesham Forest incident was a series of reported sightings of unexplained lights near Rendlesham Forest in Suffolk, England, in December 1980, which became linked with alleged UFO landings. The events occurred just outside RAF Woodbridge, which was used at the time by the United States Air Force (USAF). USAF personnel, including deputy base commander Lieutenant Colonel Charles I. Halt, claimed to have seen things he described as a UFO.","The occurrence is the most famous of alleged UFO events to have happened in the United Kingdom. It has been compared to the Roswell UFO incident in the United States and is sometimes called \"Britain's Roswell\".","The UK Ministry of Defence has stated that the event posed no threat to national security and was therefore never investigated as a security matter. Sceptics have explained the sightings as a misinterpretation of a series of nocturnal lights: a fireball, the Orfordness Lighthouse, and bright stars."]},"somerton":{"title":"Somerton Man","url":"https://en.wikipedia.org/wiki/Somerton_Man","paras":["The Somerton Man is an unidentified man whose body was found on 1 December 1948 on the beach at Somerton Park, a suburb of Adelaide, South Australia. The case is also known by the Persian phrase tamám shud (تمام شد), meaning \"It is over\" or \"It is finished\", which was printed on a scrap of paper found months later in the fob pocket of the man's trousers. The scrap had been torn from the final page of a copy of Rubáiyát of Omar Khayyám, a poetry book.","Following a public appeal by police, the book from which the page had been torn was located. On the inside back cover, detectives could read indentations left from previous handwriting: a local telephone number, another unidentified number, and text that resembled a coded message. The text has not been deciphered or interpreted in a way that satisfies authorities on the case."]},"nessie":{"title":"Loch Ness Monster","url":"https://en.wikipedia.org/wiki/Loch_Ness_Monster","paras":["The Loch Ness Monster (Scottish Gaelic: Uilebheist Loch Nis), known affectionately as Nessie, is a mythical creature in Scottish folklore that is said to inhabit Loch Ness in the Scottish Highlands. It is often described as large, long-necked, and with one or more humps protruding from the water. Popular interest and belief in the creature has varied since it was brought to worldwide attention in 1933. Evidence of its existence is anecdotal, with a number of disputed photographs and sonar readings.","The scientific community explains alleged sightings of the Loch Ness Monster as hoaxes, wishful thinking, the misidentification of known animals, mundane objects, and other recognized natural phenomena. The pseudoscience and subculture of cryptozoology has placed particular emphasis on the creature."]},"cropcircles":{"title":"Crop circle","url":"https://en.wikipedia.org/wiki/Crop_circle","paras":["A crop circle, crop formation, or corn circle is a pattern created by flattening a crop, usually a cereal. The term was coined in the early 1980s. Crop circles have been described as all falling \"within the range of the sort of thing done in hoaxes\" by Taner Edis, professor of physics at Truman State University."]},"titanic":{"title":"Titanic conspiracy theories","url":"https://en.wikipedia.org/wiki/Titanic_conspiracy_theories","paras":["On April 14, 1912, the Titanic collided with an iceberg, damaging the hull's plates below the waterline on the starboard side, causing the front compartments to flood. The ship then sank two hours and forty minutes later, with approximately 1,496 fatalities as a result of drowning or hypothermia. Since then, many conspiracy theories have been suggested regarding the disaster. These theories have been refuted by subject-matter experts. These include the hypothesis that the ship was swapped with its sister ship RMS Olympic as part of an insurance scam, and the claim that J. P. Morgan deliberately sank the ship to eliminate opponents of the Federal Reserve."]},"haarp":{"title":"High-frequency Active Auroral Research Program","url":"https://en.wikipedia.org/wiki/High-frequency_Active_Auroral_Research_Program","paras":["The High-frequency Active Auroral Research Program (HAARP) is a University of Alaska Fairbanks program which researches the ionosphere – the highest, ionized part of Earth's atmosphere. The most prominent instrument at HAARP is the Ionospheric Research Instrument (IRI), a high-power radio frequency transmitter facility operating in the high frequency (HF) band. The IRI is used to temporarily excite a limited area of the ionosphere. Other instruments, such as a VHF and a UHF radar, a fluxgate magnetometer, a digisonde (an ionospheric sounding device), and an induction magnetometer, are used to study the physical processes that occur in the excited region. Work on the HAARP facility began in 1993. Initially HAARP was jointly funded by the U.S. Air Force, the U.S. Navy, the University of Alaska Fairbanks, and the Defense Advanced Research Projects Agency (DARPA). It was designed and built by BAE Advanced Technologies. Its original purpose was to analyze the ionosphere and investigate the potential for developing ionospheric enhancement technology for radio communications and surveillance. Since 2015 it has been operated by the University of Alaska Fairbanks."]},"greatwall":{"title":"Great Wall of China","url":"https://en.wikipedia.org/wiki/Great_Wall_of_China","paras":["The Great Wall of China is a series of fortifications in China. They were built across the historical northern borders of ancient Chinese states and Imperial China as protection against various nomadic groups from the Eurasian Steppe. The first walls date to the 7th century BC; these were joined together in the Qin dynasty. Successive dynasties expanded the wall system; the best-known sections were built by the Ming dynasty (1368–1644).","To aid in defense, the Great Wall utilized watchtowers, troop barracks, garrison stations, signaling capabilities through the means of smoke or fire, and its status as a transportation corridor. Other purposes of the Great Wall have included border controls (allowing control of immigration and emigration, and the imposition of duties on goods transported along the Silk Road), and the regulation of trade."]},"chemtrails":{"title":"Chemtrail conspiracy theory","url":"https://en.wikipedia.org/wiki/Chemtrail_conspiracy_theory","paras":["The chemtrail conspiracy theory is the erroneous belief that long-lasting condensation trails left in the sky by high-flying aircraft are actually \"chemtrails\" consisting of chemical or biological agents, sprayed for nefarious purposes undisclosed to the general public. Believers in this conspiracy theory say that while normal contrails dissipate relatively quickly, contrails that linger must contain additional substances. Those who subscribe to the theory speculate that the purpose of the chemical release may be solar radiation management, weather modification, psychological manipulation, human population control, biological or chemical warfare, or testing of biological or chemical agents on a population, and that the trails are causing respiratory illnesses and other health problems."]},"phoenix":{"title":"Phoenix Lights","url":"https://en.wikipedia.org/wiki/Phoenix_Lights","paras":["The Phoenix Lights (sometimes called the \"Lights Over Phoenix\") were a series of widely sighted unidentified flying objects observed in the skies over the southwestern U.S. states of Arizona and Nevada on March 13, 1997.","Lights of varying descriptions were seen between 7:30–10:30 p.m. MST, in a space of about 300 miles (480 km), from the Nevada line, through Phoenix, to the edge of Tucson. Some witnesses described seeing what appeared to be a huge carpenter's square-shaped UFO containing five spherical lights. There were two distinct events involved in the incident: a triangular formation of lights seen to pass over the state, and a series of stationary lights seen in the Phoenix area."]},"grusch":{"title":"David Grusch UFO whistleblower claims","url":"https://en.wikipedia.org/wiki/David_Grusch_UFO_whistleblower_claims","paras":["David Grusch is a former United States Air Force (USAF) officer and intelligence official who has claimed that the U.S. federal government, in collaboration with private aerospace companies, has highly secretive special access programs involved in the recovery and reverse engineering of \"non-human\" spacecraft and their dead pilots, and that people have been threatened and killed in order to conceal these programs. Grusch further claims to have viewed documents reporting a spacecraft of alien origin had been recovered by Benito Mussolini's government in 1933 and procured by the U.S. in 1944 or 1945 with the assistance of the Vatican and the Five Eyes alliance.","The National Aeronautics and Space Administration (NASA) and the U.S. Department of Defense (DoD) have both denied Grusch's claims, stating there are no such programs and that extraterrestrial life has not been discovered. No evidence supporting Grusch's UFO claims has been presented, and they have been dismissed by multiple independent experts."]},"ajax":{"title":"1953 Iranian coup d'état","url":"https://en.wikipedia.org/wiki/1953_Iranian_coup_d%27%C3%A9tat","paras":["On 19 August 1953 a coup d'état overthrew the Prime Minister of Iran, Mohammad Mosaddegh, strengthening the rule of Mohammad Reza Pahlavi, the Shah of Iran. It was instigated by the United Kingdom (MI6), under the name Operation Boot and by the United States (CIA), under the name TP-AJAX Project or Operation Ajax. A key motive was to protect British oil interests in Iran after Mosaddegh had nationalized the country's oil industry in 1951."]},"castro":{"title":"CIA assassination attempts on Fidel Castro","url":"https://en.wikipedia.org/wiki/CIA_assassination_attempts_on_Fidel_Castro","paras":["The United States' Central Intelligence Agency (CIA) made numerous unsuccessful attempts to assassinate Cuban leader Fidel Castro. There were also attempts on Castro's life by Cuban exiles, sometimes in cooperation with the CIA. The 1975 Church Committee claimed eight proven CIA assassination attempts between 1960 and 1965. In 1976, President Gerald Ford issued Executive Order 11905 banning political assassinations. In 2006, Fabián Escalante, former chief of Cuba's intelligence, stated that there had been 634 assassination schemes or attempts. The last known plot to assassinate Castro was by Cuban exiles in 2000."]},"irancontra":{"title":"Iran–Contra affair","url":"https://en.wikipedia.org/wiki/Iran%E2%80%93Contra_affair","paras":["The Iran–Contra affair or Iran–Contra scandal (Persian: ماجرای ایران-کنترا, also referred to as the Iran Initiative or Contragate, was a political scandal in the United States that centered on arms trafficking to Iran between 1981 and 1986, facilitated by senior officials of the Reagan administration. The administration hoped to use the proceeds of the arms sale to fund the Contras, an anti-Sandinista rebel group in Nicaragua. Under the Boland Amendments, a series of laws passed by Congress and signed by Ronald Reagan, further funding of the Contras by legislative appropriations was prohibited by Congress, but the Reagan administration continued funding them secretly using non-appropriated funds."]},"sunshine":{"title":"Project SUNSHINE","url":"https://en.wikipedia.org/wiki/Project_SUNSHINE","paras":["Project SUNSHINE was a series of research studies that began in 1953 to ascertain the impact of radioactive fallout on the world's population. The project was initially kept secret, and only became known publicly in 1956. Commissioned jointly by the United States Atomic Energy Commission and USAF Project Rand, SUNSHINE sought to examine the long-term effects of nuclear radiation on the biosphere due to repeated nuclear detonations of increasing yield. With the conclusion from Project GABRIEL that radioactive isotope Strontium-90 (Sr-90) represented the most serious threat to human health from nuclear fallout, Project SUNSHINE sought to measure the global dispersion of Sr-90 by measuring its concentration in the tissues and bones of the dead. Of particular interest was tissue from the young, whose developing bones have the highest propensity to accumulate Sr-90 and thus the highest susceptibility to radiation damage. SUNSHINE elicited a great deal of controversy when it was revealed that many of the remains sampled were utilized without prior permission from relatives of the dead, which wasn't known until many years later."]},"plutonium":{"title":"Human radiation experiments","url":"https://en.wikipedia.org/wiki/Human_radiation_experiments","paras":["Since the discovery of ionizing radiation, a number of human radiation experiments have been performed to understand the effects of ionizing radiation and radioactive contamination on the human body, specifically with the element plutonium."]}},"media":{"photos":{"tuskegee":[{"f":"media/photos/tuskegee-0.jpg","credit":"Department of Health, Education, and Welfare.… · Public domain","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Tuskegee-syphilis-experiment-test-subjects.gif","file":"File:Tuskegee-syphilis-experiment-test-subjects.gif"}],"seaspray":[{"f":"media/photos/seaspray-0.jpg","credit":"en:User:Paul.h · Public domain","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:SF_From_Marin_Highlands3.jpg","file":"File:SF From Marin Highlands3.jpg"}],"paperclip":[{"f":"media/photos/paperclip-0.jpg","credit":"US Army · Public domain","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Germany_occupation_zones_with_border.jpg","file":"File:Germany occupation zones with border.jpg"}],"philadelphia":[{"f":"media/photos/philadelphia-0.jpg","credit":"U.S. Navy · Public domain","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:USS_Eldridge_(DE-173)_underway,_circa_in_1944.jpg","file":"File:USS Eldridge (DE-173) underway, circa in 1944.jpg" /* ---------- Daily drop, light streak, cliffhanger chain ---------- */
// One new file lands at the same local time every day (DATA.drops). Each file ends on a link into the next one in DATA.chain.
// Free: today's drop plus the next FREE_LINKS files in its chain, and anything you've already opened. Clearance unlocks the whole chain.
const DROP = DATA.drops, CHAIN = DATA.chain, FREE_LINKS = 2;
function dropNow(now = new Date()) {
  const [y, m, d] = DROP.launch.split("-").map(Number);
  const day = new Date(now); if (now.getHours() < DROP.hour) day.setDate(day.getDate() - 1);
  const idx = Math.max(0, Math.round((Date.UTC(day.getFullYear(), day.getMonth(), day.getDate()) - Date.UTC(y, m - 1, d)) / 864e5));
  const next = new Date(day); next.setDate(next.getDate() + 1); next.setHours(DROP.hour, 0, 0, 0);
  return { idx, c: byId[DROP.order[idx % DROP.order.length]], next };
}
const chainNext = c => byId[CHAIN[(CHAIN.indexOf(c.id) + 1) % CHAIN.length]];
function freeToday() { const d = dropNow(), ids = [d.c.id]; let c = d.c; for (let i = 0; i < FREE_LINKS; i++) { c = chainNext(c); ids.push(c.id); } return ids; }
const capFirst = s => s.charAt(0).toUpperCase() + s.slice(1);
const hourLabel = () => { const d = new Date(); d.setHours(DROP.hour, 0, 0, 0); return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); };
// light streak: a day counts when you open that day's drop; one missed day a week is forgiven
function markDrop() {
  const idx = dropNow().idx; if (S.lastDrop === idx) return;
  const gap = S.lastDrop == null ? 99 : idx - S.lastDrop;
  if (gap === 1) S.streak++; else if (gap === 2 && S.skips > 0) { S.skips--; S.streak++; toast("You missed a day. Your weekly skip kept the streak."); } else S.streak = 1;
  S.lastDrop = idx; if (S.streak % 7 === 0) S.skips = 1; save(); hud();
}
const levelOf = d => { let i = 0; LEVELS.forEach((l, j) => { if (d >= l[0]) i = j; }); return i; };

/* ---------- HUD ---------- */
function hud(gain) {
  const li = levelOf(S.depth), next = LEVELS[li + 1];
  $("#hudDepth").textContent = S.depth.toLocaleString();
  $("#hudLevel").textContent = LEVELS[li][1];
  $("#hudBar").style.width = next ? ((S.depth - LEVELS[li][0]) / (next[0] - LEVELS[li][0]) * 100) + "%" : "100%";
  $("#hudStreak").innerHTML = ico("flame") + `${S.streak}-day streak${S.skips ? " · 1 skip" : ""}`;
  $$(".streak-pill").forEach(x => x.innerHTML = ico("flame") + `${S.streak}-day streak`);
  if (gain) { const p = document.createElement("div"); p.className = "depth-pop" + ($("#hud").hidden ? " low" : ""); p.textContent = `+${gain} m`; $("#app").append(p); setTimeout(() => p.remove(), 1200); }
}
function addDepth(n) {
  const before = levelOf(S.depth); S.depth += n; save(); hud(n);
  const after = levelOf(S.depth);
  if (after > before) toast(`New depth reached: ${LEVELS[after][1]}`);
}
let toastT;
function toast(msg) { $("#toast")?.remove(); const t = document.createElement("div"); t.id = "toast"; t.setAttribute("role", "status"); t.textContent = msg; $("#app").append(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600); }

/* ---------- Cards ---------- */
const feed = $("#feed");
const nextInHole = c => chainNext(c);
// Every file, chain and episode is free, with no ads. Clearance only opens the deep record of each file and long Explore trails.
const isLocked = c => false;
const MAZE_FREE = 5;

function card(c, opt = {}) {
  const el = document.createElement("article");
  el.className = "card"; el.dataset.id = c.id; el.style.setProperty("--hue", HOLES[c.hole].hue);
  if (isLocked(c)) return lockedCard(el, c);
  const saved = S.saved.includes(c.id);
  const ph = photoOf(c), hasArt = !!(window.RHART && RHART.MAP[c.id]);
  el.innerHTML = `<div class="bg"></div>${hasArt ? '<canvas class="art" width="540" height="960" aria-hidden="true"></canvas>' : ph ? `<div class="photo" style="background-image:url('${esc(ph.f)}')"></div>` : ""}
    <div class="meta">${opt.daily ? `<span class="chip daily">Today's Rabbit Hole</span><span>Next drop in <span class="countdown"></span></span>` : `<span class="chip">${esc(HOLES[c.hole].name)}</span><span>File ${fileNo(c)} · ${esc(c.year)}</span>`}</div>
    <h2 class="hook">${hookHTML(c.hook)}</h2>
    <div class="doc"><div class="doc-head"><span>Case file ${fileNo(c)}</span><span>Evidence ${c.ev.length}</span></div>
      <ol class="ev">${c.ev.map(e => `<li>${evHTML(e)}</li>`).join("")}</ol>
      <p class="hint">Lift a black bar to see the evidence. Call it without looking for double depth.</p>
      <div class="stamp ${VERDICT[c.ans][1]}">${VERDICT[c.ans][0]}</div></div>
    <div class="call"><p class="q">Real or fake?</p><div class="btns">
      <button class="btn-call real" data-g="real">Real</button><button class="btn-call fake" data-g="fake">Fake</button></div></div>
    <aside class="rail">
      <button data-act="save" aria-pressed="${saved}" aria-label="Pin to case board"><span class="disc">${ico("pin")}</span>Pin</button>
      <button data-act="debate" aria-label="Open the discussion"><span class="disc">${ico("debate")}</span><span class="count" data-count="${c.id}">${Debate.count(c.id) || "Discuss"}</span></button>
      <button data-act="casefile" aria-label="Open the full case file"><span class="disc">${ico("file")}</span>Case</button>
      <button data-act="share" aria-label="Share this file"><span class="disc">${ico("share")}</span>Share</button>
      <button data-act="deeper" aria-label="Go deeper"><span class="disc">${ico("deeper")}</span>Deeper</button>
    </aside>${opt.first ? '<div class="swipe-hint">Swipe up for the next file</div>' : ""}`;
  return el;
}
function lockedCard(el, c) {
  el.classList.add("locked");
  const words = plain(c.hook).split(" "); const cut = Math.max(3, Math.ceil(words.length * .45));
  el.innerHTML = `<div class="bg"></div>
    <div class="meta"><span class="chip">${esc(HOLES[c.hole].name)}</span><span>Next in the chain · File ${fileNo(c)}</span></div>
    <h2 class="hook">${esc(words.slice(0, cut).join(" "))} <span class="redact-word">${esc(words.slice(cut).join(" "))}</span></h2>
    <div class="doc" aria-hidden="true"><div class="doc-head"><span>Case file ${fileNo(c)}</span><span>Evidence ${c.ev.length}</span></div><ol class="ev">${c.ev.map(e => `<li>${esc(e.replace(/\[\[|\]\]/g, ""))}</li>`).join("")}</ol></div>
    <div class="ts-stamp">CLEARANCE ONLY</div>
    <button class="unlock" data-act="unlock">${ico("lock")} Unlock the full chain</button>`;
  return el;
}
function endCard() {
  const el = document.createElement("article"); el.className = "card endcard"; el.style.setProperty("--hue", 275);
  el.innerHTML = `<div class="bg"></div><h2>That's today's free chain</h2>
    <p class="onb-sub" style="margin:0 auto">Alice drops a new file every day at ${hourLabel()}. Clearance unlocks every chain to the bottom.</p>
    <div class="big-count countdown"></div><p class="credit" style="margin:-8px 0 0">until the next drop</p>
    <button class="primary" data-act="unlock">Unlock the full chain</button>
    ${S.notify ? "" : `<button class="secondary" data-act="alerts">${ico("bell")} Remind me at ${hourLabel()}</button>`}`;
  return el;
}

function scoreCall(c, g, peeked) {
  const right = c.ans === "true" ? g === "real" : c.ans === "false" ? g === "fake" : null;
  const gain = right === true ? (peeked ? 30 : 60) : right === false ? 10 : 25;
  S.calls[c.id] = right; addDepth(gain);
  const line = right === true ? `<b style="color:var(--v-true)">Called it.</b>${peeked ? "+30 m" : "Gut call, double depth. +60 m"}`
    : right === false ? `<b style="color:var(--v-false)">Wrong call.</b>It's ${VERDICT[c.ans][0].toLowerCase()}. +10 m for digging`
    : `<b style="color:${VERDICT[c.ans][2]}">${VERDICT[c.ans][0]}.</b>Nobody can call this one yet. +25 m`;
  return { right, gain, line };
}
function callIt(el, g) {
  if (el.dataset.done) return; el.dataset.done = "1";
  const c = byId[el.dataset.id], peeked = !!el.dataset.peeked;
  const { right, line } = scoreCall(c, g, peeked);
  $$(".rx", el).forEach(r => r.classList.add("open"));
  $(".doc", el).classList.add("stamped"); $(".hint", el)?.remove(); $(".swipe-hint", el)?.remove(); el.classList.add("done");
  try { navigator.vibrate?.(right === false ? [20, 40, 20] : 30); } catch (e) {}
  const nx = nextInHole(c);
  const t = document.createElement("div"); t.className = "truth";
  t.innerHTML = `<p class="verdict-line">${line}</p><p class="tt">${esc(c.truth)}</p>
    <div class="two"><button class="dig" data-act="dig">${ico("deeper")}<span><small>Layer 3 of 6</small>Dig deeper into this file</span></button>
    <button class="deeper" data-act="deeper"><span><small>Next file</small>${esc(capFirst(nx.tease))}</span></button></div>`;
  $(".call", el).replaceWith(t);
}

function goDeeper(el) {
  const c = byId[el.dataset.id], nx = nextInHole(c);
  const d = document.createElement("div"); d.className = "dive"; $("#app").append(d); setTimeout(() => d.remove(), 750);
  const n = card(nx); el.after(n); observe(n);
  if (!el.dataset.dove) { el.dataset.dove = "1"; addDepth(40); }
  setTimeout(() => n.scrollIntoView({ behavior: "smooth" }), 180);
}

async function share(el) {
  const c = byId[el.dataset.id];
  const text = `Alice from Rabbit Hole wants to know: real or fake? "${plain(c.hook)}" I'm ${S.depth} m down.`;
  try { if (navigator.share) { await navigator.share({ title: "Rabbit Hole", text, url: location.href }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text + " " + location.href); toast("Copied. Paste it anywhere."); }
  catch (e) { toast(text); }
}

function toggleSave(el, btn) {
  const id = el.dataset.id, i = S.saved.indexOf(id);
  if (i >= 0) S.saved.splice(i, 1); else S.saved.push(id);
  save(); btn.setAttribute("aria-pressed", i < 0);
  toast(i < 0 ? "Pinned to your case board" : "Removed from your case board");
}

feed.addEventListener("click", e => {
  const el = e.target.closest(".card"); if (!el) return;
  const rx = e.target.closest(".rx");
  if (rx && !rx.classList.contains("open")) { rx.classList.add("open"); el.dataset.peeked = "1"; return; }
  const g = e.target.closest("[data-g]"); if (g) return callIt(el, g.dataset.g);
  const a = e.target.closest("[data-act]"); if (!a) return;
  ({ save: () => toggleSave(el, a), share: () => share(el), deeper: () => goDeeper(el), unlock: () => paywall(), alerts: () => Alerts.enable(), casefile: () => CaseFile.open(el.dataset.id), dig: () => CaseFile.open(el.dataset.id, 2), debate: () => Debate.open(el.dataset.id) })[a.dataset.act]?.();
});
feed.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("rx")) { e.preventDefault(); e.target.click(); } });

/* ---------- Case file: dig deeper, one layer at a time ---------- */
// Six layers per file. Layers 1-3 and 5-6 are free; the deep record (layer 4) is Clearance.
const CaseFile = (() => {
  const LAYERS = ["The claim", "The evidence", "The record", "The deep record", "Connected files", "Build this story"];
  const DEEP = DATA.deep || {};
  let c = null, shown = 0, s = null;
  const stamp = c => `<span class="stamp-chip ${VERDICT[c.ans][1]}">${VERDICT[c.ans][0]}</span>`;
  function layer(i) {
    const called = c.id in S.calls, ph = photoOf(c);
    if (i === 0) return `<h2 class="hook">${hookHTML(c.hook)}</h2><div class="cf-verdict">${called ? stamp(c) : `<p class="q">Real or fake? Call it to dig deeper.</p><div class="btns"><button class="btn-call real" data-cfcall="real">Real</button><button class="btn-call fake" data-cfcall="fake">Fake</button></div>`}</div>`;
    if (i === 1) return c.ev.map((e, k) => `<details class="ev-item" ${k === 0 ? "open" : ""}><summary><span class="n">${k + 1}</span>${esc(e.replace(/\[\[|\]\]/g, ""))}</summary><p>Where it comes from: <a href="${esc(c.src[1])}" target="_blank" rel="noopener">${esc(c.src[0])}</a></p></details>`).join("");
    if (i === 2) return `${ph ? `<figure><img src="${esc(ph.f)}" alt=""><figcaption class="credit">Photo: ${esc(ph.credit)}</figcaption></figure>` : ""}<p>${esc(c.truth)}</p><a class="cf-link" href="${esc(c.src[1])}" target="_blank" rel="noopener">Read the original: ${esc(c.src[0])} ↗</a>`;
    if (i === 3) { const d = DEEP[c.id]; if (!d) return `<p class="credit">No deep record for this file yet.</p>`;
      if (!S.cleared) return `<div class="deep-lock"><p>${esc(d.paras[0].split(/(?<=\.)\s/)[0])}</p><p class="blur" aria-hidden="true">${esc(d.paras.join(" ").slice(120, 520))}</p>
        <button class="cta" data-act="unlock">${ico("lock")} Unlock the deep record</button><p class="credit">Everything else in Rabbit Hole stays free, with no ads.</p></div>`;
      return d.paras.map(x => `<p>${esc(x)}</p>`).join("") + `<p class="credit">From Wikipedia: <a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a> · CC BY-SA 4.0</p>`; }
    if (i === 4) return `<p class="credit">Three ways to keep going from here:</p><div class="doors">${Explore.doors(c, []).map(([label, d]) => `<button class="door" data-open="${esc(d.id)}"><small>${label}</small><b>${esc(capFirst(d.tease))}</b></button>`).join("")}</div>`;
    if (i === 5) return `<label class="fld">Your notes on this file<textarea id="cfNotes" rows="4" placeholder="What doesn't add up? What would you look into next? Only you can see this.">${esc(S.notes[c.id] || "")}</textarea></label><p class="credit" id="cfSaved"></p><div class="cf-community"></div>`;
  }
  function addLayer(i, scroll) {
    const sec = document.createElement("section"); sec.className = "layer" + (scroll ? " layer-in" : ""); sec.dataset.layer = i;
    sec.innerHTML = `<h3><span>Layer ${i + 1}</span>${LAYERS[i]}${i === 3 && !S.cleared ? ` ${ico("lock")}` : ""}</h3>` + layer(i);
    $(".layers", s).append(sec);
    if (i === 5) Contrib.mountCase($(".cf-community", sec), c.id);
    if (scroll) setTimeout(() => sec.scrollIntoView({ behavior: "smooth", block: "start" }), 60);
  }
  function foot() {
    const called = c.id in S.calls, f = $(".cf-foot", s), nx = chainNext(c);
    $$(".dots i", s).forEach((d, k) => d.classList.toggle("on", k <= shown));
    if (shown >= LAYERS.length - 1) { f.innerHTML = `<p class="credit">You've reached the bottom of this file.</p><button class="deeper" data-open="${esc(nx.id)}"><span><small>Next file</small>${esc(capFirst(nx.tease))}</span></button>`; return; }
    f.innerHTML = !called && shown === 0 ? `<button class="ghost" data-show>Just show me</button>` :
      `<button class="dig" data-dig>${ico("deeper")}<span><small>Layer ${shown + 2} of ${LAYERS.length}${shown + 1 === 3 && !S.cleared ? " · Clearance" : ""}</small>Dig deeper: ${LAYERS[shown + 1].toLowerCase()}</span></button>`;
  }
  function dig() {
    shown++; addLayer(shown, true);
    if ((S.dug[c.id] || 0) < shown) { S.dug[c.id] = shown; addDepth(10); }
    try { navigator.vibrate?.(15); } catch (e) {}
    foot();
  }
  function open(id, to = 0) {
    c = byId[id]; if (!c) return; $(".scrim")?.remove();
    if (!(id in S.calls)) to = 0; else to = Math.max(to, Math.min(S.dug[id] || 0, 5));
    shown = Math.max(to, 0);
    s = document.createElement("div"); s.className = "scrim";
    s.innerHTML = `<div class="sheet casefile" role="dialog" aria-modal="true" aria-label="Case file" style="--hue:${HOLES[c.hole].hue}">
      <header><span class="chip">${esc(HOLES[c.hole].name)}</span><span class="credit">File ${fileNo(c)} · ${esc(c.year)}</span><button class="x" data-x>Close</button></header>
      <div class="dots" aria-hidden="true">${LAYERS.map(() => "<i></i>").join("")}</div>
      <div class="layers"></div><div class="cf-foot"></div></div>`;
    $("#app").append(s);
    for (let i = 0; i <= shown; i++) addLayer(i, false);
    foot();
    if (shown) setTimeout(() => $(".layer:last-child", s).scrollIntoView({ block: "start" }), 30);
    s.addEventListener("input", e => { if (e.target.id === "cfNotes") { S.notes[c.id] = e.target.value.slice(0, 4000); save(); $("#cfSaved", s).textContent = "Saved on this device"; } });
    s.addEventListener("click", e => {
      if (e.target === s || e.target.closest("[data-x]")) return s.remove();
      const cc = e.target.closest("[data-cfcall]"); if (cc) { const r = scoreCall(c, cc.dataset.cfcall, false); $(".cf-verdict", s).innerHTML = stamp(c) + `<p class="verdict-line">${r.line}</p>`; return foot(); }
      if (e.target.closest("[data-show]")) { S.calls[c.id] = null; save(); $(".cf-verdict", s).innerHTML = stamp(c); return dig(); }
      if (e.target.closest("[data-dig]")) return dig();
      if (e.target.closest("[data-act=unlock]")) return paywall();
      const o = e.target.closest("[data-open]"); if (o) return open(o.dataset.open);
    });
  }
  return { open, refresh() { if (s && s.isConnected && c) { const k = shown; open(c.id, k); } } };
})();

/* ---------- Feed queue: follow the chain ---------- */
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let queue = [], lastId = null, feedEnded = false;
const chainFrom = id => { const i = CHAIN.indexOf(id); return [...CHAIN.slice(i + 1), ...CHAIN.slice(0, i + 1)].map(x => byId[x]); };
function more(n = 5) {
  for (let i = 0; i < n && !feedEnded; i++) {
    if (!queue.length) queue = chainFrom(lastId);
    const c = queue.shift(), el = card(c); feed.append(el); observe(el); lastId = c.id;
    if (el.classList.contains("locked")) { feed.append(endCard()); feedEnded = true; tick(); }
  }
}

/* animated illustration on the card in view */
const Art = (() => {
  let el = null, raf = 0, t0 = 0, last = 0; const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function frame(now) { raf = requestAnimationFrame(frame); if (now - last < 33) return; last = now; draw((now - t0) / 1000); }
  function draw(t) { const cv = el && $("canvas.art", el); if (!cv) return; const x = cv.getContext("2d"); x.setTransform(.5, 0, 0, .5, 0, 0); x.clearRect(0, 0, 1080, 1920); RHART.draw(x, el.dataset.id, t, HOLES[byId[el.dataset.id].hole].hue); }
  return { show(card) { if (!window.RHART) return; el = card; t0 = performance.now(); cancelAnimationFrame(raf); if (!$("canvas.art", card)) return; if (still) draw(2.5); else raf = requestAnimationFrame(frame); },
    stop() { cancelAnimationFrame(raf); } };
})();
document.addEventListener("visibilitychange", () => { if (document.hidden) Art.stop(); });

const io = new IntersectionObserver(es => es.forEach(en => {
  if (!en.isIntersecting) return;
  const el = en.target; Art.show(el);
  if (!el.dataset.id) return;
  if (!el.dataset.counted) { el.dataset.counted = "1"; S.seen[el.dataset.id] = 1; S.opened++; if (!el.classList.contains("locked")) S.kept[el.dataset.id] = 1; if (el.dataset.id === dropNow().c.id) markDrop(); if (feed.firstElementChild !== el) addDepth(10); else save(); }
  const cards = $$(".card", feed); if (cards.indexOf(el) >= cards.length - 3) more();
}), { root: feed, threshold: .6 });
const observe = el => io.observe(el);

function startFeed(list) {
  feed.innerHTML = ""; feed.scrollTop = 0; feedEnded = false;
  const first = list ? list[0] : dropNow().c;
  const el = card(first, { daily: !list, first: true }); feed.append(el); observe(el); lastId = first.id;
  queue = list ? list.slice(1) : [];
  if (el.classList.contains("locked")) { feed.append(endCard()); feedEnded = true; } else more(4);
  tick();
}
function tick() {
  const s = Math.max(0, Math.floor((dropNow().next - new Date()) / 1000)), f = n => String(n).padStart(2, "0");
  $$(".countdown").forEach(x => x.textContent = `${f(Math.floor(s / 3600))}:${f(Math.floor(s / 60) % 60)}:${f(s % 60)}`);
}
setInterval(tick, 1000);

/* ---------- Alerts: "Today's Rabbit Hole: the Dyatlov Pass" ---------- */
const Alerts = {
  async enable() {
    if (!("Notification" in window) || !("serviceWorker" in navigator) || !navigator.serviceWorker.controller) return toast(`Install Rabbit Hole on your home screen to get the ${hourLabel()} drop alert.`);
    let perm = Notification.permission; try { if (perm === "default") perm = await Notification.requestPermission(); } catch (e) {}
    if (perm !== "granted") return toast("Alerts are off. You can turn them on in your phone's settings.");
    S.notify = true; save();
    try { const reg = await navigator.serviceWorker.ready; if (reg.periodicSync) await reg.periodicSync.register("rabbithole-drop", { minInterval: 6 * 3600 * 1000 }); reg.active && reg.active.postMessage({ type: "drop-alerts", on: true }); } catch (e) {}
    toast(`Done. Alice will ping you at ${hourLabel()}.`); $$('[data-act="alerts"]').forEach(b => b.remove()); if (!$("#me").hidden) renderMe();
  }
};
function announceDrop() {
  const d = dropNow(); if (S.lastSeenDrop === d.idx) return;
  if (S.lastSeenDrop != null) toast(`Today's Rabbit Hole: ${d.c.title}`);
  S.lastSeenDrop = d.idx; save();
}

document.addEventListener("keydown", e => {
  if ($("#feed").hidden || $(".scrim") || !$("#onb").hidden || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const cards = $$(".card", feed), h = feed.clientHeight, i = Math.round(feed.scrollTop / h);
  if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); cards[i + 1]?.scrollIntoView({ behavior: "smooth" }); }
  if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); cards[i - 1]?.scrollIntoView({ behavior: "smooth" }); }
  if (e.key === "r" || e.key === "f") { const c = cards[i]; c && !c.classList.contains("locked") && callIt(c, e.key === "r" ? "real" : "fake"); }
});

/* ---------- Paywall ---------- */
function paywall() {
  if ($("[data-go]")) return;   // already open; it may sit on top of a case file
  const s = document.createElement("div"); s.className = "scrim"; s.style.zIndex = 35;
  s.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pwT">
    <button class="x" data-x>Not now</button>
    <h2 id="pwT">Go deeper</h2>
    <ul>

// Search matches what people type (a rumour, a name, a question) to case files. Results open as a maze:

const Explore = (() => {

  const stem = w => w.length > 4 ? w.replace(/(ings|ing|ers|ed|es|s)$/, "") : w;
  const words = t => (t.toLowerCase().match(/[a-z0-9-]+/g) || []).filter(w => !STOP.has(w));
  const IDX = CASES.map(c => { const f = { title: words(c.title), hook: words(plain(c.hook) + " " + c.tease), rest: words([...c.ev, c.truth, HOLES[c.hole].name, c.year].join(" ").replace(/\[\[|\]\]/g, "")) };
    return { c, f, all: new Set([...f.title, ...f.hook, ...f.rest].map(stem)) }; });
  // theories that target real people or groups with no evidence never get a file
  const NOFILE = /\b(lizards?|reptil\w*|shape-?shift\w*|jews?|jewish|zionis\w*|rothschilds?|soros|bloodlines?|globalists?)\b/i;
  function search(q) {
    if (NOFILE.test(q)) return [];
    const qs = words(q); const terms = new Set(); qs.forEach(w => { terms.add(stem(w)); (SYN[w] || "").split(" ").filter(Boolean).forEach(x => terms.add(stem(x))); });
    if (!terms.size) return [];
    return IDX.map(({ c, f }) => { let sc = 0; terms.forEach(t => { if (f.title.some(w => stem(w) === t)) sc += 4; if (f.hook.some(w => stem(w) === t)) sc += 2; if (f.rest.some(w => stem(w) === t)) sc += 1; else if (t.length > 3 && f.rest.some(w => w.startsWith(t))) sc += .5; }); return { c, sc }; })

    const other = CASES.filter(x => x.hole !== c.hole && !seen.has(x.id)).map(x => [x, sim(c, x)]).sort((a, b) => b[1] - a[1])[0]; if (other) out.push(["A different angle", other[0]]);

        <div class="row-btns"><button class="cta" data-file="${esc(c.id)}">Dig into this file</button>${hasReel ? `<button class="ghost" data-watch="${esc(c.id)}">${ico("watch")} Watch</button>` : ""}</div></div>
      <h3 class="doors-h">Choose your next door</h3>
      ${path.length >= MAZE_FREE && !S.cleared ? `<p class="credit">You're ${path.length} layers down. Clearance keeps the trail going.</p>` : ""}<div class="doors">${doors(c, path).map(([label, d]) => `<button class="door${path.length >= MAZE_FREE && !S.cleared ? " locked" : ""}" data-door="${esc(d.id)}"><small>${label}${path.length >= MAZE_FREE && !S.cleared ? " · clearance" : ""}</small><b>${esc(capFirst(d.tease))}</b></button>`).join("")}</div></div>`;
  }
  function resultsHTML() {
    if (!query) return `<div class="chips">${SUGGEST.map(x => `<button data-suggest="${esc(x)}">${esc(x)}</button>`).join("")}</div>`;
    if (!results.length) return `<div class="nofile"><b>Alice hasn't opened that file.</b><p>Nothing in the record matches "${esc(query)}" yet. Some theories target real people with no evidence at all, and Rabbit Hole only opens files it can source. Try a different angle:</p>
      <div class="doors">${["moon", "birds", "chemtrails"].map(id => byId[id]).map(d => `<button class="door" data-start="${d.id}"><small>Too Good to Be True</small><b>${esc(capFirst(d.tease))}</b></button>`).join("")}</div>

  });
  return { html, search, doors };
})();

/* ---------- Community: pre-moderated discussion, off until a moderator switches it on ---------- */
// Nothing anyone writes is public until a moderator approves it.
//   posts/<id>    each person's own submissions (only they and moderators can read them)
//   approved/<case>  the public thread, written only by moderators
//   reports/<id>  each person's reports (read by moderators)
//   mod/settings, mod/bans  read by everyone, written by moderators;  modlog/log  moderators only
const RULES_DEFAULT = "Argue about the evidence, not the person.\nNo harassment, hate or threats.\nNo personal information: no names of private people, addresses or phone numbers.\nNo links.\nNo health or election claims that could hurt someone.\nA moderator reads every post before it appears.";
const Filter = (() => {
  const BLOCK = [
    [/\b(kys|kill (yo)?urself|go die)\b/i, "Harassment"],
    [/\b(i('ll| will)|gonna|going to) (kill|hurt|shoot|find|dox) (you|u|him|her|them)\b/i, "Threat"],
    [/https?:\/\/|www\.|\b[a-z0-9-]+\.(com|net|org|io|ly|gg|ru|co|xyz|me|tv)\b/i, "Link"],
    [/[\w.+-]+@[\w-]+\.[\w.]+/, "Email address"],
    [/(\+?\d[\s().-]?){9,}/, "Phone number"],
    [/\b\d{1,5}\s+\w+(\s\w+)?\s+(street|st|avenue|ave|road|rd|lane|ln|drive|dr|boulevard|blvd|close|crescent)\b/i, "Street address"],
    [/\b(lives at|home address|where (he|she|they) lives?|doxx?)\b/i, "Personal information"],
  ];
  const FLAG = [
    [/\b(vaccin\w*|5g|chemo\w*|cures?|ivermectin|bleach|autism|fluoride)\b/i, "Health claim"],
    [/\b(election|ballots?|rigged|voter fraud|stolen)\b/i, "Election claim"],
    [/\b(jews?|jewish|zionists?|globalists?|cabal|rothschilds?|reptilians?|lizard people)\b/i, "Possible hate trope"],
    [/\b(crisis actors?|staged (shooting|attack)|paid actors?)\b/i, "Claim about real victims"],
  ];
  return (text, extra = []) => {
    const block = [], flag = [];
    BLOCK.forEach(([re, why]) => re.test(text) && block.push(why));
    extra.forEach(w => { w = (w || "").trim(); if (w && new RegExp("\\b" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i").test(text)) block.push("Blocked word"); });
    FLAG.forEach(([re, why]) => re.test(text) && flag.push(why));
    const L = text.replace(/[^a-z]/gi, ""); if (L.length > 20 && L.replace(/[^A-Z]/g, "").length / L.length > .7) flag.push("Shouting");
    return { block: [...new Set(block)], flag: [...new Set(flag)] };
  };
})();
