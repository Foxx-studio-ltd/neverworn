    s.innerHTML = `<form class="sheet" role="dialog" aria-modal="true" aria-labelledby="pfT"><button type="button" class="x" data-x>Not now</button><h2 id="pfT">Make your profile</h2>
      <p class="onb-sub" style="margin:0">Your handle shows on everything you post. Everything is checked by a moderator before it appears.</p>
      <label class="fld">Handle<input id="pfH" maxlength="20" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="e.g. groomlake_watcher"></label>
      <p class="credit" id="pfHint" style="margin:-6px 0 0">3 to 20 characters: lowercase letters, numbers and underscores.</p>
      <label class="fld">About you (optional)<textarea id="pfB" maxlength="160" placeholder="What do you dig into?"></textarea></label>
      <button class="cta" type="submit">Create profile</button></form>`;
    $("#app").append(s);
    s.addEventListener("click", e => { if (e.target === s || e.target.closest("[data-x]")) s.remove(); });
    s.addEventListener("input", e => { if (e.target.id !== "pfH") return; const v = e.target.value, f = v.toLowerCase().replace(/\s+/g, "_").replace(/[^a-z0-9_]/g, ""); if (f !== v) e.target.value = f;
      const hint = $("#pfHint", s); hint.textContent = f.length < 3 ? `3 to 20 characters: lowercase letters, numbers and underscores. ${3 - f.length} more to go.` : `@${f} looks good.`; hint.style.color = f.length < 3 ? "" : "var(--v-true)"; });
    s.addEventListener("submit", e => { e.preventDefault(); const h = $("#pfH", s).value.trim().toLowerCase(), b = $("#pfB", s).value.trim();
      if (!/^[a-z0-9_]{3,20}$/.test(h)) { const hint = $("#pfHint", s); hint.textContent = "Your handle needs 3 to 20 characters: lowercase letters, numbers and underscores."; hint.style.color = "var(--v-false)"; return $("#pfH", s).focus(); }
      const f = Filter(h + " " + b, []); if (f.block.length) return toast("Choose a different handle or bio.");
      C.setProfile({ handle: h, bio: b }); s.remove(); toast("Profile created"); then(); });
    setTimeout(() => $("#pfH", s)?.focus(), 50);
  }
  function compose(caseId, kind = "tip") {
    if (!C.on) return toast("Contributions open when accounts launch.");
    needProfile(() => {
      $(".scrim")?.remove();
      const isNew = caseId === "_cases", c = byId[caseId];
      const s = document.createElement("div"); s.className = "scrim";
      s.innerHTML = `<form class="sheet compose-sheet" role="dialog" aria-modal="true" aria-labelledby="cpT"><button type="button" class="x" data-x>Cancel</button>
        <h2 id="cpT">${isNew ? "Open a new case" : "Add to this case"}</h2>${c ? `<p class="credit" style="margin:0">${esc(capFirst(c.title))}</p>` : ""}
        <div class="filters" role="group" aria-label="What are you adding">${isNew ? "" : `<button type="button" data-k="tip" aria-pressed="${kind === "tip"}">Evidence or a tip</button>`}<button type="button" data-k="video" aria-pressed="${kind === "video"}">${isNew ? "With a video" : "A video"}</button>${isNew ? `<button type="button" data-k="case" aria-pressed="${kind !== "video"}">Text only</button>` : ""}</div>
        ${isNew ? `<label class="fld">Case title<input id="cpTitle" maxlength="80" required placeholder="What should we look into?"></label>` : ""}
        <label class="fld">${isNew ? "What do you know?" : "What do you know that isn't in the file?"}<textarea id="cpText" maxlength="500" rows="4" placeholder="Stick to what you can back up. Say where it comes from."></textarea></label>
        <label class="fld">Source link (optional)<input id="cpSrc" type="url" inputmode="url" placeholder="https://"></label>
        <label class="fld vid" hidden>Your video (under 20 MB)<input id="cpVid" type="file" accept="video/*" capture="environment"></label>
        <p class="fine" style="text-align:left">No personal information about private people. No medical or election claims. A moderator reads and watches everything first.</p>
        <button class="cta" type="submit">Send for review</button></form>`;
      $("#app").append(s);
      let k = isNew ? (kind === "video" ? "video" : "case") : kind; const sync = () => { $$("[data-k]", s).forEach(b => b.setAttribute("aria-pressed", b.dataset.k === k)); $(".vid", s).hidden = k !== "video"; }; sync();
      s.addEventListener("click", e => { if (e.target === s || e.target.closest("[data-x]")) return s.remove(); const b = e.target.closest("[data-k]"); if (b) { k = b.dataset.k; sync(); } });
      s.addEventListener("submit", async e => {
        e.preventDefault(); const btn = $(".cta", s); const text = $("#cpText", s).value.trim(), src = $("#cpSrc", s).value.trim(), title = isNew ? $("#cpTitle", s).value.trim() : undefined;
        if (!text && k !== "video") return toast("Write what you know first.");
        let asset;
        if (k === "video") { const f = $("#cpVid", s).files[0]; if (!f) return toast("Choose a video."); btn.disabled = true; btn.textContent = "Uploading…";
          try { asset = await C.upload(f); } catch (er) { btn.disabled = false; btn.textContent = "Send for review"; return toast(er.message || "Upload failed."); } }
        const err = C.submit({ type: isNew ? (k === "video" ? "case" : "case") : k, caseId, text, ...(title ? { title } : {}), ...(src ? { source: src } : {}), ...(asset ? { asset } : {}) });
        if (err) { btn.disabled = false; btn.textContent = "Send for review"; return toast(err); }
        s.remove(); toast("Sent. It appears once a moderator approves it.");
      });
    });
  }
  function profile(id) {
    $(".scrim")?.remove(); const p = C.profileOf(id) || {}, posts = C.allPub().filter(x => x.by === id);
    const s = document.createElement("div"); s.className = "scrim";
    s.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="prT"><button class="x" data-x>Close</button>
      <h2 id="prT">${esc(C.nm(id))}</h2>${p.bio ? `<p class="onb-sub" style="margin:0">${esc(p.bio)}</p>` : ""}
      <div class="stats" style="margin:0"><div class="stat"><b>${posts.length}</b><span>Published</span></div><div class="stat"><b>${posts.filter(x => x.type === "case").length}</b><span>Cases opened</span></div></div>
      <div class="posts">${posts.length ? posts.map(x => postHTML(x)).join("") : '<p class="credit">Nothing published yet.</p>'}</div></div>`;
    $("#app").append(s);
    s.addEventListener("click", e => { if (e.target === s || e.target.closest("[data-x]")) return s.remove(); const cl = e.target.closest("[data-case]"); if (cl) { s.remove(); CaseFile.open(cl.dataset.case); } });
  }
  // the Community tab: everyone's published evidence, videos and new cases
  const v = $("#people");
  function render() {
    const list = C.allPub(), mineP = C.on ? C.minePending().filter(x => x.status !== "approved") : [];
    C.resolveNames(list.map(x => x.by));
    v.innerHTML = `<h1>Community</h1><p class="lede">Evidence, videos and new cases from people digging alongside Alice. A moderator checks everything before it appears.</p>
      ${C.on ? `<div class="row-btns"><button class="cta" data-new>Open a new case</button>${C.profileOf(C.me) ? `<button class="ghost" data-profile="${esc(C.me)}">My profile</button>` : ""}</div>` :
        `<div class="clr"><span><b>Posting opens with accounts.</b> Soon you'll be able to add evidence and videos to any case, open new cases and follow other diggers.</span></div>`}
      <div class="posts">${[...mineP, ...list].map(x => postHTML(x)).join("") || '<p class="credit">Nothing published yet. Be the first to add to a case.</p>'}</div>`;
  }
  v.addEventListener("click", e => {
    if (e.target.closest("[data-new]")) return compose("_cases", "case");
    const pr = e.target.closest("[data-profile]"); if (pr) return profile(pr.dataset.profile);
    const cl = e.target.closest("[data-case]"); if (cl) return CaseFile.open(cl.dataset.case);
  });
  C.onChange(() => { if (!v.hidden) render(); });
  return { mountCase, compose, profile, render };
})();

/* ---------- Watch: Alice's episodes, played as one chain ---------- */
const Watch = (() => {
  const v = $("#watch"); let built = false, sound = false, on = false, timer = 0;
  const has = c => (MEDIA.reels || {})[c.id];
  function list() { const d = dropNow().c, out = [d, ...chainFrom(d.id)].filter(has); return out.filter((c, i) => out.indexOf(c) === i); }
  const io = new IntersectionObserver(es => es.forEach(en => { const vid = $("video", en.target); if (!vid) return;
    if (en.isIntersecting && on && !en.target.classList.contains("locked")) { if (vid.preload !== "auto") vid.preload = "auto"; vid.muted = !sound; vid.play().catch(() => {}); S.seen[en.target.dataset.id] = 1; S.kept[en.target.dataset.id] = 1; if (en.target.dataset.id === dropNow().c.id) markDrop(); save(); }
    else { vid.pause(); $(".nextup", en.target)?.remove(); clearTimeout(timer); } }), { root: v, threshold: .7 });
  function render() {
    if (built) return; built = true; v.innerHTML = `<div class="watch-top"><div><span class="pill streak-pill">${ico("flame")}${S.streak}-day streak</span><button class="pill" data-ask aria-label="Ask Alice">${ico("search")}Ask Alice</button><span class="pill">Next drop <span class="countdown"></span></span></div></div>`; tick();
    const L = list();
    if (!L.length) { v.innerHTML = `<div class="watch-empty"><b>No episodes here yet</b><span>Alice's episodes play in the installed Rabbit Hole app.</span></div>`; return; }
    for (const c of L) {
      const r = MEDIA.reels[c.id], el = document.createElement("article"), locked = isLocked(c); el.className = "reel" + (locked ? " locked" : ""); el.dataset.id = c.id; el.style.setProperty("--hue", HOLES[c.hole].hue);
      el.innerHTML = `<video src="${locked ? "" : esc(r.mp4)}" poster="${esc(r.poster || "")}" playsinline preload="none" aria-label="${esc(plain(c.hook))}"></video>
        ${locked ? `<button class="unlock" data-unlock>${ico("lock")} Next episode: unlock the full chain</button>` : `<button class="sound" data-sound ${sound ? "hidden" : ""}>Tap for sound</button>
        <aside class="rail">
          <button data-act="save" aria-pressed="${S.saved.includes(c.id)}" aria-label="Pin to case board"><span class="disc">${ico("pin")}</span>Pin</button>
          <button data-act="debate" aria-label="Open the discussion"><span class="disc">${ico("debate")}</span><span class="count" data-count="${c.id}">${Community.count(c.id) || "Discuss"}</span></button>
          <button data-act="share" aria-label="Share"><span class="disc">${ico("share")}</span>Share</button>
          <button data-act="file" aria-label="Open the case file"><span class="disc">${ico("file")}</span>File</button></aside>`}
        <div class="reel-info"><span class="chip" style="justify-self:start">${c.id === dropNow().c.id ? "Today's Rabbit Hole" : esc(HOLES[c.hole].name)}</span><b>${esc(locked ? capFirst(c.tease) : plain(c.hook))}</b><span class="credit">Rabbit Hole · File ${fileNo(c)} · with Alice</span></div><div class="reel-bar"><i></i></div>`;
      const vid = $("video", el);
      vid.addEventListener("timeupdate", () => {
        $(".reel-bar i", el).style.width = (vid.currentTime / (vid.duration || 1) * 100) + "%";
        // Alice asks "Real or fake?": the episode waits for your call
        if (r.ask && !el.dataset.called && vid.currentTime >= r.ask && vid.currentTime < r.ask + 2) { vid.pause(); askCall(el); }
        if (el.dataset.result && r.verdictAt && vid.currentTime >= r.verdictAt) { toast(el.dataset.result); delete el.dataset.result; }
      });
      vid.addEventListener("ended", () => nextUp(el));
      v.append(el); io.observe(el);
      if (locked) break;   // the chain stops at the first locked episode
    }
  }
  function askCall(el) {
    if ($(".callbox", el)) return;
    const c = byId[el.dataset.id], box = document.createElement("div"); box.className = "callbox";
    box.innerHTML = `<p>Real or fake?</p><div class="btns"><button class="btn-call real" data-wcall="real">Real</button><button class="btn-call fake" data-wcall="fake">Fake</button></div>`;
    el.append(box);
  }
  function nextUp(el) {
    const nx = el.nextElementSibling; if (!nx) return;
    const c = byId[nx.dataset.id]; let n = 3;
    n = 6;
    const box = document.createElement("div"); box.className = "nextup"; box.innerHTML = `<small>Next file in <span>${n}</span></small><b>${esc(capFirst(c.tease))}</b>
      <div class="two"><button class="dig" data-digreel>${ico("deeper")}<span><small>Stay on this one</small>Dig into this file</span></button><button class="deeper" data-skipnext><span><small>Or</small>Next file now</span></button></div>`; el.append(box);
    const step = () => { n--; if (n <= 0) { box.remove(); nx.scrollIntoView({ behavior: "smooth" }); return; } $("span", box).textContent = n; timer = setTimeout(step, 1000); };
    timer = setTimeout(step, 1000);
  }
  v.addEventListener("click", e => {
    if (e.target.closest("[data-ask]")) { tab("holes"); return setTimeout(() => $("#askQ")?.focus(), 50); }
    const el = e.target.closest(".reel"); if (!el) return;
    if (e.target.closest("[data-unlock]")) return paywall();
    if (e.target.closest("[data-ask]")) { tab("holes"); return setTimeout(() => $("#askQ")?.focus(), 50); }
    const wc = e.target.closest("[data-wcall]");
    if (wc) { const c = byId[el.dataset.id], r = scoreCall(c, wc.dataset.wcall, false); el.dataset.called = "1"; el.dataset.result = r.line.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); $(".callbox", el).remove(); $("video", el).play().catch(() => {}); return; }
    if (e.target.closest("[data-digreel]")) { clearTimeout(timer); $(".nextup", el)?.remove(); return CaseFile.open(el.dataset.id, 2); }
    if (e.target.closest(".nextup")) { clearTimeout(timer); $(".nextup", el).remove(); return el.nextElementSibling?.scrollIntoView({ behavior: "smooth" }); }
    if (e.target.closest(".callbox")) return;
    const a = e.target.closest("[data-act]");
    if (a) return ({ save: () => toggleSave(el, a), debate: () => Community.open(el.dataset.id), share: () => share(el), file: () => CaseFile.open(el.dataset.id) })[a.dataset.act]?.();
    if (el.classList.contains("locked")) return paywall();
    const vid = $("video", el);
    if (e.target.closest("[data-sound]") || !sound) { sound = true; $$(".reel video", v).forEach(x => x.muted = false); $$("[data-sound]", v).forEach(b => b.hidden = true); vid.play().catch(() => {}); return; }
    vid.paused ? vid.play().catch(() => {}) : vid.pause();
  });
  return { render, home() { v.scrollTo({ top: 0, behavior: "smooth" }); }, reset() { built = false; if (!v.hidden) render(); },
    active(x) { on = x; if (!x) { $$(".reel video", v).forEach(vd => vd.pause()); clearTimeout(timer); } else $$(".reel", v).forEach(el => { io.unobserve(el); io.observe(el); }); } };
})();

/* ---------- Tabs ---------- */
const TABS = { feed: ["file", "Files"], watch: ["home", "Home"], people: ["debate", "Community"], holes: ["search", "Explore"], me: ["me", "You"], mod: ["shield", "Mod"] };
$$(".tabs button").forEach(b => { if (!TABS[b.dataset.tab]) return; const [i, l] = TABS[b.dataset.tab]; b.innerHTML = ico(i) + (b.dataset.tab === "mod" ? `<span class="count">${l}</span>` : l); });
function tab(name) {
  $$(".tabs button").forEach(b => b.dataset.tab === name ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  ["feed", "watch", "people", "holes", "board", "me", "mod"].forEach(v => $("#" + v).hidden = v !== name);
  Watch.active(name === "watch"); if (name !== "feed") Art.stop();
  $("#hud").hidden = name !== "feed";
  if (name === "watch") Watch.render(); if (name === "people") Contrib.render(); if (name === "holes") renderHoles(); if (name === "board") renderBoard(); if (name === "me") renderMe(); if (name === "mod") Community.render();
}
$(".tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (!b) return; if (b.dataset.tab === "watch" && !$("#watch").hidden) return Watch.home(); if (b.dataset.tab === "feed" && !$("#feed").hidden) { feed.scrollTo({ top: 0, behavior: "smooth" }); return; } tab(b.dataset.tab); });

/* ---------- Onboarding ---------- */
function onboarding() {
  const o = $("#onb"); o.hidden = false;
  o.innerHTML = `<canvas id="tunnel" aria-hidden="true"></canvas><div class="onb-step" id="step1">
      ${MARK("onb-logo")}
      <h1 class="wordmark">Rabbit<br>H${RINGS}le</h1>
      <p class="tagline">Some of it was <mark>true.</mark></p>
      <p class="onb-sub">One new file every day at ${hourLabel()}, opened by your host, Alice. Call it real or fake, then follow the chain down.</p>
      <button class="go-btn" id="go1">Pick your first holes</button></div>`;
  const cv = $("#tunnel", o), ctx = cv.getContext("2d"); let t = 0, raf, speed = 1;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function draw() {
    const w = cv.width = cv.clientWidth * devicePixelRatio, h = cv.height = cv.clientHeight * devicePixelRatio;
    ctx.fillStyle = "#13101c"; ctx.fillRect(0, 0, w, h);
    const cx = w / 2, cy = h * .34, n = 26;
    for (let i = n; i > 0; i--) {
      const z = ((i - (t % 1)) / n), r = Math.pow(z, 2.2) * Math.max(w, h) * 1.1;
      const ox = Math.sin(t * .35 + z * 3) * 30 * z * devicePixelRatio, oy = Math.cos(t * .27 + z * 2) * 22 * z * devicePixelRatio;
      ctx.beginPath(); ctx.arc(cx + ox, cy + oy + (1 - z) * 30, Math.max(1, r), 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(239,227,196,${.05 + z * .28})`; ctx.lineWidth = (1 + z * 3) * devicePixelRatio; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(cx, cy + 30, 4 * devicePixelRatio, 0, Math.PI * 2); ctx.fillStyle = "#f2e14c"; ctx.fill();
    t += .006 * speed; if (!reduce) raf = requestAnimationFrame(draw);
  }
  draw();
  $("#go1", o).onclick = () => {
    const picks = new Set(S.picks);
    $("#step1", o).outerHTML = `<div class="onb-step" id="step2"><h2 class="onb-h">Alice wants to know: what keeps you up at night?</h2><p class="onb-sub">Pick at least one. We'll start you there.</p>
      <div class="picks">${Object.entries(HOLES).map(([k, h]) => `<button class="pick" data-k="${k}" aria-pressed="${picks.has(k)}" style="--hue:${h.hue}"><b>${esc(h.name)}</b><small>${esc(h.blurb)}</small></button>`).join("")}</div>
      <button class="go-btn" id="go2" ${picks.size ? "" : "disabled"}>Enter the hole</button></div>`;
    const step = $("#step2", o);
    step.addEventListener("click", e => {
      const p = e.target.closest(".pick");
      if (p) { const k = p.dataset.k; picks.has(k) ? picks.delete(k) : picks.add(k); p.setAttribute("aria-pressed", picks.has(k)); $("#go2", o).disabled = !picks.size; return; }
      if (e.target.closest("#go2")) {
        S.picks = [...picks]; S.onboarded = true; save();
        speed = 9; step.style.transition = "opacity .5s"; step.style.opacity = 0;
        startFeed();
        setTimeout(() => { cancelAnimationFrame(raf); o.hidden = true; o.innerHTML = ""; }, reduce ? 0 : 900);
      }
    });
  };
}

/* ---------- Boot ---------- */
hud(); tab(Object.keys(MEDIA.reels || {}).length ? "watch" : "feed");
if (S.onboarded) { startFeed(); announceDrop(); } else onboarding();
tick();
window.RabbitHole = { get state() { return S; }, CASES, HOLES, MEDIA, paywall, startFeed, tab, Community, Contrib, CaseFile, Explore, Watch, dropNow, freeToday, Filter };
})();
</script>
