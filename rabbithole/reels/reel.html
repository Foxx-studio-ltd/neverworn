<!doctype html>
<!-- Rabbit Hole reel renderer. Deterministic: render(t) draws the frame at time t.
     Open reel.html?r=mkultra (served from the repo root). Timeline comes from build/<reel>.json (voice.py). -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Courier+Prime:wght@400;700&family=Inter+Tight:wght@500;600;700&display=swap">
<style>
:root { --ink:#13101c; --ink2:#1e1929; --paper:#efe3c4; --pink:#2a2116; --text:#f3eee2; --muted:#a59fb3; --mark:#f2e14c; --red:#d0372c; --green:#2f9d5c; }
html,body { margin:0; background:#000; }
#f { position:relative; width:1080px; height:1920px; overflow:hidden; background:var(--ink); color:var(--text); font-family:"Inter Tight",sans-serif; }
#bg, #grain { position:absolute; inset:0; width:1080px; height:1920px; }
#grain { mix-blend-mode:overlay; opacity:.55; pointer-events:none; z-index:20; }
.vig { position:absolute; inset:0; z-index:19; background:radial-gradient(120% 80% at 50% 45%, transparent 55%, rgba(0,0,0,.65)); pointer-events:none; }
#shake { position:absolute; inset:0; }
.top { position:absolute; z-index:10; left:56px; right:56px; top:70px; }
.bars { display:flex; gap:8px; }
.bars i { flex:1; height:8px; border-radius:4px; background:rgba(243,238,226,.22); overflow:hidden; }
.bars b { display:block; height:100%; background:var(--text); }
.chiprow { display:flex; align-items:center; gap:18px; margin-top:30px; font-weight:700; font-size:30px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.chiprow svg { width:58px; height:74px; }
.chip { padding:6px 14px; border-radius:8px; background:hsla(var(--hue),50%,55%,.25); color:hsl(var(--hue),70%,84%); }
#photo { position:absolute; inset:0; z-index:0; overflow:hidden; }
#shake { z-index:2; }
#art { position:absolute; inset:0; width:1080px; height:1920px; z-index:1; opacity:0; }
#artfade { position:absolute; inset:0; z-index:1; pointer-events:none; opacity:0; background:linear-gradient(180deg, rgba(19,16,28,.55) 0%, transparent 14%, transparent 62%, rgba(19,16,28,.9) 76%, #13101c 100%); }
#photo .ph { position:absolute; inset:-4%; background-size:cover; background-position:center 35%; filter:grayscale(.35) contrast(1.1) brightness(.78) sepia(.12); }
#photo::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(19,16,28,.7) 0%, rgba(19,16,28,.1) 22%, rgba(19,16,28,.15) 48%, rgba(19,16,28,.88) 70%, rgba(19,16,28,.97) 100%), linear-gradient(hsla(var(--hue),60%,30%,.28), hsla(var(--hue),60%,30%,.28)); mix-blend-mode:normal; }
.credit { position:absolute; z-index:11; right:56px; top:190px; max-width:640px; text-align:right; font-size:21px; font-weight:600; letter-spacing:.04em; color:rgba(243,238,226,.6); text-shadow:0 2px 6px rgba(0,0,0,.8); }
.slip { position:relative; width:900px; box-sizing:border-box; padding:46px 54px 54px; background:var(--paper); color:var(--pink); font-family:"Courier Prime",monospace; box-shadow:0 40px 90px rgba(0,0,0,.65); }
.slip .hd { display:flex; justify-content:space-between; font-weight:700; font-size:26px; letter-spacing:.16em; margin-bottom:26px; }
.slip .tx { font-size:56px; font-weight:700; line-height:1.28; }
.slip .r { border-radius:6px; padding:0 .12em; box-decoration-break:clone; -webkit-box-decoration-break:clone; }
.hookyear { font-family:"Big Shoulders Display",Impact,sans-serif; font-weight:900; font-size:300px; line-height:.8; text-shadow:0 20px 60px rgba(0,0,0,.7); }
#stage { position:absolute; z-index:5; left:0; right:0; top:250px; height:1060px; display:grid; place-items:center; }
#cap { position:absolute; z-index:12; left:70px; right:70px; top:1380px; height:330px; display:flex; align-items:center; justify-content:center; text-align:center; }
#cap p { margin:0; font-family:"Big Shoulders Display",Impact,sans-serif; font-weight:900; font-size:118px; line-height:1.02; text-transform:uppercase; letter-spacing:.005em; text-wrap:balance; text-shadow:0 6px 0 rgba(0,0,0,.55), 0 0 40px rgba(0,0,0,.6); }
#cap span { display:inline-block; padding:0 .07em; margin:0 .04em; border-radius:10px; }
#cap span.on { background:var(--mark); color:var(--ink); text-shadow:none; transform:scale(1.06) rotate(-1.5deg); }
#cap span.fut { opacity:.4; }
.host { position:absolute; z-index:13; left:56px; bottom:70px; display:flex; align-items:center; gap:16px; transition:opacity .3s; }
.host svg { width:92px; height:116px; filter:drop-shadow(0 6px 14px rgba(0,0,0,.6)); }
.host b { display:block; font-family:"Big Shoulders Display",Impact,sans-serif; font-weight:900; font-size:44px; letter-spacing:.04em; line-height:.9; }
.host span { font-weight:700; font-size:22px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
.foot { position:absolute; z-index:10; left:0; right:0; bottom:86px; text-align:center; font-weight:700; font-size:28px; letter-spacing:.18em; text-transform:uppercase; color:rgba(243,238,226,.55); }

/* scene parts */
.year { font-family:"Big Shoulders Display",Impact,sans-serif; font-weight:900; font-size:400px; line-height:.8; letter-spacing:-.01em; color:var(--text); text-shadow:0 20px 60px rgba(0,0,0,.6); }
.yrlbl { font-weight:700; font-size:40px; letter-spacing:.3em; text-transform:uppercase; color:var(--mark); text-align:center; margin-top:26px; }
.doc { position:relative; width:820px; padding:60px 64px 70px; box-sizing:border-box; background:var(--paper); color:var(--pink); font-family:"Courier Prime",monospace; box-shadow:0 40px 90px rgba(0,0,0,.6); }
.doc::before { content:""; position:absolute; inset:0; background:radial-gradient(120% 90% at 100% 0%, rgba(120,90,40,.22), transparent 60%), radial-gradient(80% 60% at 0% 100%, rgba(90,60,20,.18), transparent 60%); pointer-events:none; }
.doc .hd { display:flex; justify-content:space-between; font-weight:700; font-size:26px; letter-spacing:.14em; margin-bottom:34px; }
.doc .cls { text-align:center; font-weight:700; font-size:28px; letter-spacing:.2em; color:var(--red); margin-bottom:26px; }
.doc .subj { font-size:44px; font-weight:700; line-height:1.15; min-height:104px; }
.doc .ln { height:20px; margin:22px 0; background:rgba(42,33,22,.28); border-radius:3px; }
.doc .rx { display:inline-block; height:34px; background:#111; vertical-align:middle; border-radius:3px; }
.stamp { position:absolute; padding:10px 34px; border:10px solid currentColor; border-radius:16px; font-family:"Big Shoulders Display",Impact,sans-serif; font-weight:900; font-size:130px; letter-spacing:.05em; line-height:1; text-transform:uppercase; mix-blend-mode:multiply; white-space:nowrap; }
.stamp.free { mix-blend-mode:normal; background:rgba(19,16,28,.7); }
.red { color:var(--red); } .grn { color:var(--green); } .ylw { color:var(--mark); }
.big { font-family:"Big Shoulders Display",Impact,sans-serif; font-weight:900; text-transform:uppercase; }
.lbl { font-weight:700; letter-spacing:.24em; text-transform:uppercase; font-size:36px; color:var(--muted); }
.tag { position:absolute; padding:8px 16px; background:var(--red); color:#fff; font-weight:700; font-size:26px; letter-spacing:.1em; border-radius:6px; white-space:nowrap; }
.btn { width:400px; height:170px; border-radius:30px; display:grid; place-items:center; font-family:"Big Shoulders Display",Impact,sans-serif; font-weight:900; font-size:96px; letter-spacing:.06em; background:var(--ink2); border:5px solid; }
</style></head><body>
<div id="f" style="--hue:275">
  <canvas id="bg" width="540" height="960"></canvas>
  <div id="photo"></div>
  <canvas id="art" width="1080" height="1920"></canvas><div id="artfade"></div>
  <div id="shake">
    <div class="top"><div class="bars" id="bars"></div><div class="chiprow" id="chips"></div></div>
    <div id="stage"></div>
    <div class="credit" id="credit"></div>
    <div id="cap"></div>
    <div class="host" id="host"></div>
    <div class="foot" style="left:auto;right:56px;text-align:right">Rabbit Hole</div>
  </div>
  <div class="vig"></div>
  <canvas id="grain" width="540" height="960"></canvas>
</div>
<script src="anim.js"></script>
<script>
const MARK = (h) => `<svg viewBox="0 0 120 152" height="${h}"><g fill="#efe3c4"><ellipse cx="41" cy="38" rx="14" ry="36" transform="rotate(-13 41 38)"/><ellipse cx="79" cy="38" rx="14" ry="36" transform="rotate(13 79 38)"/><circle cx="60" cy="88" r="40"/><path d="M45 112 H75 L84 146 Q60 152 36 146 Z"/></g><g fill="#13101c"><ellipse cx="40" cy="36" rx="5.5" ry="24" transform="rotate(-13 40 36)"/><ellipse cx="80" cy="36" rx="5.5" ry="24" transform="rotate(13 80 36)"/><circle cx="60" cy="88" r="31"/><path d="M51 110 H69 L76 140 Q60 144 44 140 Z"/></g><g fill="none" stroke="#efe3c4" stroke-width="2.2"><circle cx="60" cy="91" r="24" opacity=".55"/><circle cx="60" cy="94" r="17.5" opacity=".42"/><circle cx="60" cy="96.5" r="11.5" opacity=".3"/><circle cx="60" cy="98.5" r="6" opacity=".22"/></g><circle cx="60" cy="99.5" r="2.8" fill="#f2e14c"/></svg>`;
// Alice, the host: the rabbit-keyhole mark whose tunnel rings pulse as she speaks
const HOSTMARK = (h, a) => { const k = 1 + a * .35; return `<svg viewBox="0 0 120 152" height="${h}"><g fill="#efe3c4"><ellipse cx="41" cy="38" rx="14" ry="36" transform="rotate(${-13 - a * 6} 41 38)"/><ellipse cx="79" cy="38" rx="14" ry="36" transform="rotate(${13 + a * 6} 79 38)"/><circle cx="60" cy="88" r="40"/><path d="M45 112 H75 L84 146 Q60 152 36 146 Z"/></g><g fill="#13101c"><ellipse cx="40" cy="36" rx="5.5" ry="24" transform="rotate(${-13 - a * 6} 40 36)"/><ellipse cx="80" cy="36" rx="5.5" ry="24" transform="rotate(${13 + a * 6} 80 36)"/><circle cx="60" cy="88" r="31"/><path d="M51 110 H69 L76 140 Q60 144 44 140 Z"/></g><g fill="none" stroke="#efe3c4" stroke-width="2.2">${[[91, 24, .55], [94, 17.5, .42], [96.5, 11.5, .3], [98.5, 6, .22]].map(([y, r, o], i) => `<circle cx="60" cy="${y}" r="${Math.min(29, r * (1 + (k - 1) * (1 - i * .2)))}" opacity="${o + a * .3}"/>`).join('')}</g><circle cx="60" cy="99.5" r="${2.8 + a * 3}" fill="#f2e14c"/></svg>`; };
const amp = t => { const e = T.env || []; const i = Math.floor(t * 30); return e[i] || 0; };
const RINGS = `<svg viewBox="0 0 80 80" style="display:inline-block;width:.74em;height:.74em;vertical-align:-.02em;margin:0 .02em"><circle cx="40" cy="40" r="38" fill="#efe3c4"/><circle cx="40" cy="40" r="30" fill="#13101c"/><g fill="none" stroke="#efe3c4" stroke-width="2.4"><circle cx="40" cy="43" r="23" opacity=".55"/><circle cx="40" cy="46" r="16" opacity=".42"/><circle cx="40" cy="48.5" r="10" opacity=".3"/></g><circle cx="40" cy="50.5" r="3.4" fill="#f2e14c"/></svg>`;
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eo = x => 1 - Math.pow(1 - cl(x), 3);
const back = x => { x = cl(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const rnd = n => { const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
const P = new URLSearchParams(location.search), R = P.get('r') || 'mkultra';
let T, HUE;
const SLAMS = []; // times of stamps/hits, also exported for the soundtrack

// ---------- scene renderers: (lt, s) -> html. lt = seconds since scene start ----------
const wordT = (s, re) => { const w = s.words.find(w => re.test(w[0])); return w ? w[1] - s.start : 0; };
const stamp = (txt, cls, lt, at, x, y, rot = -12, size = 130, free) => { if (lt < at) return ''; const k = back((lt - at) / .28), sc = 2.4 - 1.4 * k;
  return `<div class="stamp ${cls} ${free ? 'free' : ''}" style="left:${x}px;top:${y}px;font-size:${size}px;transform:translate(-50%,-50%) rotate(${rot}deg) scale(${sc});opacity:${cl((lt - at) / .08) * .92}">${txt}</div>`; };
const typed = (str, lt, at, cps = 22) => { const n = Math.floor(cl((lt - at) * cps, 0, str.length)); return str.slice(0, n) + (n < str.length && lt > at ? '<span style="opacity:.6">▌</span>' : ''); };
const docLines = (n, seed, lt, at = 0) => Array.from({ length: n }, (_, i) => { const w = 55 + rnd(seed + i) * 45, r = rnd(seed * 7 + i) > .55;
  return `<div style="display:flex;gap:14px;align-items:center;opacity:${cl((lt - at - i * .08) / .3)}"><div class="ln" style="width:${r ? w * .45 : w}%"></div>${r ? `<span class="rx" style="width:${18 + rnd(i + seed) * 22}%"></span>` : ''}</div>`; }).join('');

const SCENES = {
  date(lt, s) {
    const k = back(lt / .4), sc = 2.6 - 1.6 * k, push = 1 + lt * .02;
    const decor = R === 'mkultra' ? blotter(lt) : pentagon(lt);
    return `<div style="display:grid;justify-items:center;gap:40px;transform:scale(${push})">
      <div class="year" style="transform:scale(${sc});opacity:${cl(lt / .1)}">${s.date}</div>
      <div class="yrlbl" style="opacity:${cl((lt - .5) / .4)}">${R === 'mkultra' ? 'CIA · LSD · Unwitting' : 'Joint Chiefs of Staff'}</div>
      <div style="opacity:${cl((lt - .8) / .6)};transform:translateY(${(1 - eo((lt - .8) / .8)) * 80}px)">${decor}</div></div>`;
  },
  doc(lt, s) {
    const z = 1 + lt * .012;
    return `<div class="doc" style="transform:rotate(-2deg) scale(${z}) translateY(${(1 - eo(lt / .5)) * 300}px)">
      <div class="hd"><span>MEMORANDUM</span><span>${R === 'mkultra' ? '13 APR 1953' : '13 MAR 1962'}</span></div>
      <div class="cls">${R === 'mkultra' ? 'SECRET · EYES ONLY' : 'TOP SECRET · SPECIAL HANDLING · NOFORN'}</div>
      <div class="subj">SUBJECT: ${typed(s.title, lt, .35, 18)}</div>
      ${docLines(7, R.length, lt, .6)}
      ${stamp(s.stamp, 'red', lt, wordT(s, /MKUltra|Northwoods/) + .45, 440, 560, -14, 120)}</div>`;
  },
  people(lt, s) {
    const n = 5, kn = wordT(s, /knew/);
    const fig = i => `<div style="position:relative;opacity:${cl((lt - i * .18) / .3)};transform:translateY(${(1 - eo((lt - i * .18) / .5)) * 60}px)">
      <svg width="170" height="300" viewBox="0 0 170 300"><circle cx="85" cy="70" r="52" fill="#2b2440"/><path d="M5 300 Q5 150 85 150 Q165 150 165 300 Z" fill="#2b2440"/></svg>
      ${lt > 1 + i * .3 ? `<div class="tag" style="left:50%;top:40px;transform:translateX(-50%) rotate(${(rnd(i) - .5) * 10}deg) scale(${back((lt - 1 - i * .3) / .25)})">SUBJECT ${String(i + 1).padStart(2, '0')}</div>` : ''}
      ${lt > kn && i % 2 === 0 ? `<div style="position:absolute;left:50%;top:150px;transform:translateX(-50%);font:700 24px 'Courier Prime';color:var(--mark);white-space:nowrap;opacity:${cl((lt - kn - i * .1) / .2)}">DIDN'T KNOW</div>` : ''}</div>`;
    return `<div style="display:grid;gap:60px;justify-items:center"><div class="lbl">Test subjects</div><div style="display:flex;gap:28px;align-items:flex-end">${Array.from({ length: n }, (_, i) => fig(i)).join('')}</div>
      <div class="big" style="font-size:90px;color:var(--mark);opacity:${cl((lt - 2) / .4)}">No consent</div></div>`;
  },
  mirror(lt, s) {
    const g = cl((lt - wordT(s, /agents/)) / 1.2), sweep = ((lt * .35) % 1.4) * 1200 - 300;
    return `<div style="display:grid;gap:40px;justify-items:center;transform:scale(${1 + lt * .01})"><div class="lbl" style="color:var(--mark)">Safehouse · San Francisco</div>
      <div style="position:relative;width:820px;height:760px;border:22px solid #3a3150;border-radius:8px;overflow:hidden;background:linear-gradient(160deg,#2d2840,#16121f);box-shadow:0 40px 90px rgba(0,0,0,.6),inset 0 0 120px rgba(0,0,0,.6)">
        <svg width="820" height="760" style="position:absolute;inset:0;opacity:${.12 + g * .8}">
          <g fill="#0b0910"><circle cx="270" cy="330" r="70"/><rect x="200" y="250" width="140" height="22" rx="6"/><rect x="225" y="205" width="90" height="55" rx="10"/><path d="M130 760 Q130 440 270 440 Q410 440 410 760Z"/>
          <circle cx="560" cy="350" r="66"/><rect x="494" y="272" width="132" height="22" rx="6"/><rect x="518" y="228" width="84" height="52" rx="10"/><path d="M430 760 Q430 460 560 460 Q690 460 690 760Z"/></g></svg>
        <div style="position:absolute;top:-200px;bottom:-200px;width:180px;left:${sweep}px;transform:rotate(18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent)"></div>
        <div style="position:absolute;left:0;right:0;bottom:30px;text-align:center;font:700 30px 'Courier Prime';letter-spacing:.2em;color:rgba(239,227,196,.7)">ONE-WAY MIRROR</div></div>
      <div class="lbl">Operation Midnight Climax · 1955</div></div>`;
  },
  destroy(lt, s) {
    const at = wordT(s, /destroyed/) + .1, sh = cl((lt - at - .4) / 1.6);
    const strips = Array.from({ length: 14 }, (_, i) => { const d = sh * (500 + rnd(i) * 900), r = (rnd(i + 9) - .5) * 40 * sh;
      return `<div style="position:absolute;left:${i * (820 / 14)}px;top:0;width:${820 / 14 - 3}px;height:100%;background:var(--paper);transform:translateY(${d}px) rotate(${r}deg);opacity:${1 - sh * .7}"></div>`; }).join('');
    return `<div style="position:relative;width:820px;height:900px;transform:rotate(1.5deg)">
      <div style="position:absolute;inset:0;overflow:visible">${sh > 0 ? strips : ''}</div>
      <div class="doc" style="position:absolute;inset:0;opacity:${sh > 0 ? 0 : 1}"><div class="hd"><span>MKULTRA · FILES</span><span>1973</span></div><div class="cls">ORDER OF THE DIRECTOR</div>${docLines(12, 4, lt)}</div>
      ${stamp('DESTROY', 'red free', lt, at, 410, 420, -10, 150, true)}</div>`;
  },
  counter(lt, s) {
    const n = Math.round(eo(lt / 2.2) * s.to), at = wordT(s, /misfiled/) + .15;
    const stack = Array.from({ length: 9 }, (_, i) => `<div style="height:44px;margin-top:-18px;background:${i % 2 ? '#e3d5b0' : '#efe3c4'};border-radius:4px 4px 0 0;box-shadow:0 -4px 8px rgba(0,0,0,.25);width:${640 - (i % 3) * 14}px;opacity:${cl(lt * 4 - i * .4)}"></div>`).reverse().join('');
    return `<div style="position:relative;display:grid;justify-items:center;gap:30px">
      <div class="big" style="font-size:300px;line-height:.85;font-variant-numeric:tabular-nums">${n.toLocaleString('en-US')}</div><div class="lbl" style="color:var(--mark)">${s.label}</div>
      <div style="display:grid;justify-items:center;margin-top:60px">${stack}</div>
      ${stamp(s.stamp, 'ylw free', lt, at, 540, 640, -9, 120, true)}</div>`;
  },
  hearing(lt, s) {
    return `<div style="display:grid;justify-items:center;gap:50px;transform:scale(${1 + lt * .012})">
      <svg width="520" height="300" viewBox="0 0 520 300" style="opacity:${cl(lt / .6)}"><g fill="#efe3c4" opacity=".9">
        <rect x="235" y="0" width="50" height="40" rx="6"/><path d="M150 150 Q150 40 260 40 Q370 40 370 150Z"/><rect x="130" y="150" width="260" height="22"/>
        ${Array.from({ length: 9 }, (_, i) => `<rect x="${140 + i * 28}" y="178" width="14" height="70"/>`).join('')}<rect x="20" y="250" width="480" height="24"/><rect x="0" y="278" width="520" height="22"/></g></svg>
      <div class="doc" style="width:860px;text-align:center;transform:translateY(${(1 - eo((lt - .3) / .6)) * 200}px);opacity:${cl((lt - .3) / .3)}">
        <div class="hd" style="justify-content:center">JOINT HEARING · US SENATE · ${s.date}</div>
        <div class="subj" style="font-size:46px">${typed("PROJECT MKULTRA, THE CIA'S PROGRAM OF RESEARCH IN BEHAVIORAL MODIFICATION", lt, .7, 34)}</div></div></div>`;
  },
  list(lt, s) {
    const rows = [[/Blow/, 'Blow up a US ship', 'ship'], [/hijacking/, 'Fake a hijacking', 'plane'], [/Stage/, 'Terror in Miami', 'city']];
    const ic = { ship: '<path d="M10 60 L110 60 L95 85 L25 85Z"/><rect x="40" y="38" width="40" height="22"/><rect x="55" y="18" width="10" height="20"/>',
      plane: '<path d="M10 55 L110 45 L110 55 L70 60 L45 90 L35 90 L48 60 L20 62 L12 75 L5 75 Z"/>',
      city: '<rect x="10" y="50" width="20" height="40"/><rect x="34" y="25" width="22" height="65"/><rect x="60" y="40" width="18" height="50"/><rect x="82" y="15" width="26" height="75"/>' };
    return `<div style="display:grid;gap:44px;width:900px"><div class="lbl" style="text-align:center">The proposals</div>${rows.map(([re, txt, k], i) => { const at = wordT(s, re) - .1;
      return `<div style="display:flex;align-items:center;gap:34px;padding:30px 36px;border-radius:24px;background:#221c30;border:3px solid ${lt > at ? 'var(--red)' : '#3a3150'};opacity:${cl((lt - at) / .2) * .9 + .1};transform:translateX(${(1 - eo((lt - at) / .4)) * -120}px)">
        <div class="big" style="font-size:90px;color:var(--red);width:70px">${i + 1}</div><svg width="120" height="100" viewBox="0 0 120 100" fill="#efe3c4">${ic[k]}</svg>
        <div class="big" style="font-size:70px;line-height:1">${txt}</div></div>`; }).join('')}</div>`;
  },
  map(lt, s) {
    const d = eo((lt - .4) / 1.4), at = wordT(s, /Cuba/);
    return `<div style="position:relative;width:900px;height:900px;border-radius:30px;overflow:hidden;background:repeating-linear-gradient(0deg,transparent 0 89px,rgba(239,227,196,.08) 89px 90px),repeating-linear-gradient(90deg,transparent 0 89px,rgba(239,227,196,.08) 89px 90px),#191426">
      <svg width="900" height="900" style="position:absolute;inset:0"><path d="M300 230 Q420 420 560 650" stroke="#efe3c4" stroke-width="6" stroke-dasharray="20 16" fill="none" stroke-dashoffset="${-lt * 60}" pathLength="1000" style="clip-path:inset(0 0 ${(1 - d) * 100}% 0)"/>
      <circle cx="300" cy="230" r="22" fill="#efe3c4"/><circle cx="560" cy="650" r="${22 + (lt > at ? Math.sin(lt * 8) * 6 + 6 : 0)}" fill="var(--red)"/></svg>
      <div class="big" style="position:absolute;left:150px;top:140px;font-size:64px">Miami</div>

      <div class="lbl" style="position:absolute;left:470px;top:400px;color:var(--text)">90 miles</div>

  },
  sign(lt, s) {
    const at = wordT(s, /Lemnitzer/) - .6, k = cl((lt - at) / 1.3);
    return `<div class="doc" style="width:860px;transform:rotate(1.5deg) scale(${1 + lt * .012})">
      <div class="hd"><span>JCSM-272-62</span><span>13 MARCH 1962</span></div>${docLines(5, 11, lt)}
      <div style="margin-top:40px;font-size:30px">For the Joint Chiefs of Staff:</div>
      <svg width="560" height="170" viewBox="0 0 560 170" style="margin:10px 0"><path d="M20 120 C60 20 90 20 100 110 C110 160 140 30 170 60 C190 80 180 130 210 100 C240 70 250 60 270 110 C290 150 320 40 350 70 C370 90 380 120 410 90 C440 60 470 100 540 80" fill="none" stroke="#1b2a6b" stroke-width="7" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${100 - k * 100}"/></svg>
      <div style="font-size:38px;font-weight:700">${typed('L. L. LEMNITZER', lt, at + .3, 16)}</div>

  },
  reject(lt, s) {
    return `<div style="position:relative;display:grid;justify-items:center;gap:40px">
      <div class="doc" style="width:820px;transform:rotate(-1.5deg)"><div class="hd"><span>OPERATION NORTHWOODS</span><span>1962</span></div><div class="cls">TOP SECRET</div>${docLines(10, 23, 9)}</div>
      ${stamp('REJECTED', 'red free', lt, wordT(s, /no\./) - .05, 410, 470, -12, 160, true)}

  },
  years(lt, s) {

      <div class="big" style="font-size:330px;line-height:.85;font-variant-numeric:tabular-nums">${y}</div>
      <div style="width:860px;height:20px;border-radius:10px;background:#2b2440;overflow:hidden"><div style="height:100%;width:${k * 100}%;background:var(--mark)"></div></div>
      <div style="display:flex;justify-content:space-between;width:860px" class="lbl"><span>${s.from}</span><span>${Math.round((s.to - s.from) * k)} years</span><span>${s.to}</span></div>
      ${stamp('DECLASSIFIED', 'ylw free', lt, at, 450, 560, -8, 128, true)}</div>`;
  },
  call(lt, s) {
    // generic episodes leave the choice to the viewer (the app pauses here); only scripted showcase cuts tap REAL themselves
    const tap = s.verdict ? 1.15 : 1e9, at = 1.45, ring = cl((lt - tap) / .5);
    return `<div style="position:relative;display:grid;justify-items:center;gap:80px">
      <div class="big" style="font-size:150px;line-height:.9;text-align:center">Real<br>or fake?</div>
      <div style="display:flex;gap:40px"><div class="btn" style="border-color:${lt > tap ? '#5fd68e' : 'rgba(95,214,142,.55)'};background:${lt > tap ? 'rgba(95,214,142,.2)' : 'var(--ink2)'};transform:scale(${lt > tap && lt < tap + .15 ? .94 : 1})">REAL</div><div class="btn" style="border-color:rgba(255,93,79,.55)">FAKE</div></div>
      ${lt > tap ? `<div style="position:absolute;left:${240 - 60 * ring}px;bottom:${-20 - 60 * ring}px;width:${120 + 120 * ring}px;height:${120 + 120 * ring}px;border-radius:50%;border:6px solid rgba(243,238,226,${.8 - ring * .8})"></div>` : ''}
      ${s.verdict ? stamp(s.verdict, 'grn free', lt, at, 450, 320, -12, 230, true) : ''}</div>`;
  },
  ident(lt, s) {
    const a = amp(t0), k = back(lt / .5);
    return `<div style="display:grid;justify-items:center;gap:30px;text-align:center">
      <div style="transform:scale(${k})">${HOSTMARK(460, a)}</div>
      <div class="big" style="font-size:56px;letter-spacing:.12em;color:var(--mark);opacity:${cl((lt - .3) / .3)}">Rabbit Hole · File ${T.file}</div>

  hook(lt, s) {

    return `<div style="display:grid;justify-items:center;gap:${top ? 10 : 26}px;align-self:start;margin-top:${top ? -40 : 120}px">

  },
  verdict(lt, s) {
    return `<div style="position:relative;width:1000px;height:900px">
      ${stamp(s.verdict, s.cls + ' free', lt, .12, 500, 330, -10, s.verdict.length > 8 ? 150 : 210, true)}
</div>`;

      <div style="transform:scale(${back(lt / .6)});opacity:${cl(lt / .2)}">${MARK(420)}</div>

  }
};
function blotter(lt) {
  const cells = Array.from({ length: 16 }, (_, i) => `<div style="width:118px;height:118px;border:2px dashed rgba(19,16,28,.35);box-sizing:border-box;transform:scale(${back((lt - .9 - i * .04) / .3)})"></div>`).join('');
  return `<div style="position:relative;display:grid;grid-template-columns:repeat(4,118px);background:repeating-radial-gradient(circle at 50% 60%,#efe3c4 0 18px,#e7c9e8 19px 36px,#f2e14c 37px 44px);transform:rotate(${-8 + lt * 2}deg);box-shadow:0 30px 70px rgba(0,0,0,.6)">${cells}</div>`;
}
function pentagon(lt) {
  const k = cl((lt - .8) / 1.4), p = Array.from({ length: 5 }, (_, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; return [240 + 200 * Math.cos(a), 230 + 200 * Math.sin(a)]; });
  const inner = p.map(([x, y]) => [240 + (x - 240) * .5, 230 + (y - 230) * .5]);
  const path = q => 'M' + q.map(v => v.join(' ')).join(' L') + ' Z';
  return `<svg width="480" height="440"><path d="${path(p)}" stroke="#efe3c4" stroke-width="10" fill="rgba(208,55,44,${.12 + .1 * Math.sin(lt * 4)})" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${100 - k * 100}"/><path d="${path(inner)}" stroke="#efe3c4" stroke-width="6" fill="none" opacity=".6" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${100 - k * 100}"/></svg>`;
}
// stamps & hits for the soundtrack (scene-relative)
const HITS = { ident: s => [], hook: s => [.05], verdict: s => [.12], date: s => [.05], doc: s => [wordT(s, /MKUltra|Northwoods/) + .45], destroy: s => [wordT(s, /destroyed/) + .1], counter: s => [wordT(s, /misfiled/) + .15],
  map: s => [wordT(s, /Cuba/) + .1], reject: s => [wordT(s, /no\./) - .05], years: s => [wordT(s, /declassified/) + .1], call: s => s.verdict ? [1.45] : [], end: s => [0] };

// ---------- captions ----------
let CHUNKS = [];
function buildChunks() {
  for (const s of T.scenes) { let cur = [];
    s.words.forEach((w, i) => { cur.push(w); const brk = /[.?!,]$/.test(w[0]) || cur.length >= 3; if (brk || i === s.words.length - 1) { CHUNKS.push({ words: cur, start: cur[0][1], scene: s }); cur = []; } }); }
  CHUNKS.forEach((c, i) => c.end = Math.min(CHUNKS[i + 1] ? CHUNKS[i + 1].start : 1e9, c.words[c.words.length - 1][2] + .7));
}
function caption(t) {
  const c = CHUNKS.find(c => t >= c.start - .02 && t < c.end); if (!c) return '';
  const pop = back((t - c.start) / .18);
  return `<p style="transform:scale(${.85 + .15 * pop})">${c.words.map((w, i) => { const on = t >= w[1] - .02 && (i === c.words.length - 1 ? t < c.end : t < c.words[i + 1][1] - .02);
    return `<span class="${on ? 'on' : t < w[1] - .02 ? 'fut' : ''}">${w[0].replace(/[,]$/, '')}</span>`; }).join(' ')}</p>`;
}

// ---------- background & grain ----------
const bg = document.getElementById('bg').getContext('2d'), gr = document.getElementById('grain').getContext('2d');
const NOISE = Array.from({ length: 6 }, (_, k) => { const c = document.createElement('canvas'); c.width = 540; c.height = 960; const x = c.getContext('2d'), im = x.createImageData(540, 960);
  for (let i = 0; i < im.data.length; i += 4) { const v = rnd(i * .37 + k * 1000) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 60; } x.putImageData(im, 0, 0); return c; });
function drawBg(t, scene) {
  const w = 540, h = 960; bg.fillStyle = '#13101c'; bg.fillRect(0, 0, w, h);
  const g = bg.createRadialGradient(w / 2, h * .95, 0, w / 2, h * .95, h * .8); g.addColorStop(0, `hsla(${HUE},55%,38%,.55)`); g.addColorStop(1, 'rgba(19,16,28,0)'); bg.fillStyle = g; bg.fillRect(0, 0, w, h);
  const speed = scene && scene.scene === 'end' ? 1.4 : .18, n = 22, cx = w / 2, cy = h * .45;
  for (let i = n; i > 0; i--) { const z = (i - (t * speed) % 1) / n, r = Math.pow(z, 2.1) * h * 1.2;
    bg.beginPath(); bg.arc(cx + Math.sin(t * .3 + z * 3) * 18 * z, cy + Math.cos(t * .25 + z * 2) * 14 * z, Math.max(1, r), 0, 7);
    bg.strokeStyle = `rgba(239,227,196,${.02 + z * .1})`; bg.lineWidth = 1 + z * 2; bg.stroke(); }
  gr.clearRect(0, 0, w, h); gr.drawImage(NOISE[Math.floor(t * 24) % 6], 0, 0);
}

// ---------- archive photo layer ----------
let t0 = 0, PHOTOS = [], HAS_ART = false;
const ARTSC = { hook: 1, call: .3, verdict: 1 };
const photoOf = s => { if (!PHOTOS.length || s.scene === 'end' || s.photo === null || (HAS_ART && ARTSC[s.scene])) return null; const i = s.photo !== undefined ? s.photo : T.scenes.indexOf(s); return PHOTOS[i % PHOTOS.length]; };
function photoLayer(t, s, lt) {
  const i = T.scenes.indexOf(s), cur = photoOf(s), prev = i > 0 ? photoOf(T.scenes[i - 1]) : null;
  const kb = (ph, sc, k) => { if (!ph) return ''; const sd = rnd(sc.start * 3 + 1), dur = sc.end - sc.start, z = 1 + .14 * cl(k / dur), dx = (sd - .5) * 60 * cl(k / dur), dy = (rnd(sd * 9) - .5) * 40 * cl(k / dur);
    return `<div class="ph" style="background-image:url('${ph.src}');transform:scale(${z}) translate(${dx}px,${dy}px)"></div>`; };
  const fade = cl(lt / .6);
  document.getElementById('photo').innerHTML = (prev && prev !== cur && fade < 1 ? kb(prev, T.scenes[i - 1], t - T.scenes[i - 1].start) : '') +
    (cur ? `<div style="position:absolute;inset:0;opacity:${prev && prev !== cur ? fade : 1}">${kb(cur, s, lt)}</div>` : '');
  document.getElementById('credit').textContent = cur ? `Photo: ${cur.credit}` : s.source ? `Source: ${s.source}` : '';
}

// ---------- frame ----------
function render(t) {
  const s = T.scenes.find(x => t >= x.start - (x === T.scenes[0] ? 1 : 0) && t < x.end) || T.scenes[T.scenes.length - 1];
  const lt = Math.max(0, t - s.start);
  drawBg(t, s); t0 = t; photoLayer(t, s, lt);
  const art = document.getElementById('art'), ax = art.getContext('2d'), ao = HAS_ART ? (ARTSC[s.scene] || (s.scene === 'ev' && !photoOf(s) ? .22 : 0)) : 0;
  ax.clearRect(0, 0, 1080, 1920);
  if (ao) RHART.draw(ax, T.caseId || R, lt, HUE);
  art.style.opacity = ao * cl(lt / .4); document.getElementById('artfade').style.opacity = ao ? 1 : 0;
  document.getElementById('bars').innerHTML = T.scenes.map(x => `<i><b style="width:${cl((t - x.start) / (x.end - x.start)) * 100}%"></b></i>`).join('');
  // scene cross-fade in

  document.getElementById('cap').innerHTML = caption(t);
  const showHost = !['ident', 'end'].includes(s.scene);
  document.getElementById('host').style.opacity = showHost ? 1 : 0;
  if (showHost) document.getElementById('host').innerHTML = `${HOSTMARK(116, amp(t))}<div><b>ALICE</b><span>Your host</span></div>`;
  const last = SLAMS.filter(x => x <= t).pop(), dt = last === undefined ? 9 : t - last;

}
const preload = srcs => Promise.all(srcs.map(u => new Promise(res => { const im = new Image(); im.onload = im.onerror = res; im.src = u; })));
window.ready = Promise.all([fetch(`build/${R}.json`).then(r => r.json()), fetch('../data/media.json').then(r => r.json()).catch(() => ({}))]).then(async ([j, media]) => {
  T = j; window.DURATION = j.duration; HUE = j.hue !== undefined ? j.hue : R === 'mkultra' ? 275 : 8;
  PHOTOS = ((media.photos || {})[j.caseId || R] || []).map(p => ({ src: '../' + p.f, credit: p.credit }));
  HAS_ART = !!(window.RHART && RHART.MAP[j.caseId || R] && j.scenes.some(x => x.scene === 'hook'));
  await preload(PHOTOS.map(p => p.src));

  buildChunks();
